<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Sun-ice</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sun-ice">
<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #F8FAFC;
    --card: #ffffff;
    --border: #E2E8F0;
    --text: #0F172A;
    --text-secondary: #64748B;
    --accent: #E60012;
    --accent-bg: #FEE2E2;
    --danger: #a32d2d;
    --navy: #0F172A;
    --navy-2: #1E293B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #fff; }

  /* Install banner */
  .install-banner {
    display: none;
    background: linear-gradient(to right, #111827, var(--navy-2), var(--navy));
    color: #fff;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    font-size: 13px;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #1e293b;
  }
  .install-banner.show { display: flex; }
  .install-banner-text { flex: 1; line-height: 1.4; display: flex; align-items: center; gap: 8px; }
  .install-banner-text::before {
    content: '';
    width: 5px; height: 22px;
    background: var(--accent);
    border-radius: 3px;
    flex-shrink: 0;
  }
  .install-banner button {
    background: #fff;
    color: var(--navy);
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .install-banner .close-x {
    background: transparent;
    color: #94a3b8;
    font-size: 16px;
    padding: 4px 6px;
    font-weight: 400;
  }

  /* Header */
  header {
    padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .install-banner.show ~ .app header { padding-top: 16px; }

  /* Пропозиція встановити застосунок — вигляд, близький до нативного системного діалогу */
  .install-gate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 3000;
    align-items: flex-end;
    justify-content: center;
  }
  .install-gate.show { display: flex; }
  .install-gate-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
  }
  .install-gate-sheet {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 34px rgba(0,0,0,0.28);
    animation: install-gate-slide-up 0.22s ease-out;
  }
  @keyframes install-gate-slide-up {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .install-gate-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .install-gate-appicon img { width: 52px; height: 52px; border-radius: 14px; display: block; box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
  .install-gate-appinfo { flex: 1; min-width: 0; }
  .install-gate-appname { font-size: 16px; font-weight: 700; color: var(--text); }
  .install-gate-appsub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .install-gate-desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.55; margin: 0 0 16px; }
  .install-gate-list { margin: 0 0 14px; padding-left: 18px; font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; }
  .install-gate-install-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 8px;
  }
  .install-gate-later-btn, .install-gate-skip-btn, .install-gate-back-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 8px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    opacity: 0.75;
  }
  .install-gate-later-btn:active, .install-gate-skip-btn:active, .install-gate-back-btn:active { opacity: 1; }
  .header-top { display: flex; align-items: center; gap: 10px; }
  .back-btn {
    display: none;
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--text);
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin: 0; flex: 1; display: flex; align-items: center; gap: 9px; }
  h1::before {
    content: '';
    width: 9px; height: 9px;
    background: var(--accent);
    border-radius: 2px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .status-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .status-text { font-size: 12px; color: var(--text-secondary); flex: 1; }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn-text {
    width: auto;
    height: 34px;
    padding: 0 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    border-color: var(--accent);
    white-space: nowrap;
  }
  input[type=file] { display: none; }

  .rate-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12.5px; color: var(--text-secondary); }
  .rate-label { font-weight: 600; }
  .rate-value { color: var(--text); font-weight: 700; }
  .rate-input {
    width: 70px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12.5px;
    background: var(--card);
    color: var(--text);
  }
  .rate-edit-btn, .rate-save-btn {
    width: 24px; height: 24px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  input[type=text] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  select {
    padding: 10px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }

  main { flex: 1; padding: 8px 12px 90px; background: var(--bg); }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.6;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px -1px rgba(15,23,42,0.06);
    display: flex;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  .nav-btn {
    position: relative;
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 2px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn .nav-icon { font-size: 19px; line-height: 1; }
  .nav-btn.active { color: var(--accent); font-weight: 700; }
  .nav-btn.active::before {
    content: '';
    position: absolute;
    top: 0;
    width: 30px;
    height: 3px;
    border-radius: 0 0 4px 4px;
    background: var(--accent);
  }

  /* Home menu (catalog categories) */
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-top: 8px;
  }
  .menu-tile {
    background: var(--card);
    border: 1px solid #CBD5E1;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 92px;
    justify-content: space-between;
    box-shadow: 0 2px 8px -2px rgba(15,23,42,0.05), 0 1px 4px -1px rgba(15,23,42,0.03);
    transition: box-shadow .15s, transform .1s, border-color .15s;
  }
  .menu-tile:active { transform: scale(0.985); border-color: #CBD5E1; box-shadow: none; }
  .menu-tile-row { display: flex; align-items: center; justify-content: space-between; }
  .menu-tile-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; color: var(--text); }
  .menu-tile-empty { cursor: default; border-color: rgba(203,213,225,0.7); }
  .menu-tile-empty:active { transform: none; }
  .menu-tile-empty .menu-tile-title { color: var(--text-secondary); font-weight: 600; }
  .menu-tile-soon {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #64748b;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    padding: 2px 8px;
  }
  /* Перемикач бренду MHI / GAL у прайсі */
  .brand-toggle {
    display: flex;
    gap: 6px;
    padding: 4px 0 12px;
  }
  .brand-toggle-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .brand-toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .menu-tile-icon {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 4px 10px;
    border-radius: 6px;
    background: #d8f5ea;
    color: #00875a;
    border: 1px solid #99e6cb;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .03em;
  }
  .menu-tile-empty .menu-tile-icon {
    background: #edf2f7;
    color: #475569;
    border: 1px solid #cbd5e1;
  }

  /* List rows */
  .row {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  /* Верхня частина рядка (назва + ціна/кнопки) — окремий блок, щоб зона кліку "пошук в
     Google" (яка розтягується на всю висоту свого контейнера) НЕ перекривала форму
     калькулятора, коли та розкрита нижче. */
  .row-top {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  /* Клікабельна зона для пошуку в Google — тільки ліва чверть верхньої частини рядка
     (не весь рядок і не весь напис, і не заходить у розкритий калькулятор нижче) */
  .row-click-zone {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 25%;
    min-width: 60px;
    cursor: pointer;
    z-index: 1;
  }
  /* Форма калькулятора виводиться нижче row-top, притиснута праворуч — під ціною товару */
  .calc-panel-slot {
    display: flex;
    justify-content: flex-end;
  }
  .segment-header {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 14px 6px 6px;
    border-bottom: 3px solid var(--border);
    margin-bottom: 8px;
  }
  .segment-header-info { cursor: pointer; }
  .segment-header-info:active { color: var(--accent); }
  .segment-header-info-icon { margin-left: 4px; font-size: 11px; letter-spacing: normal; }

  /* Спливаюче вікно "детальніше" — повний опис серії з прайсу */
  .info-sheet-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2500;
    align-items: flex-end;
    justify-content: center;
  }
  .info-sheet-overlay.show { display: flex; }
  .info-sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
  }
  .info-sheet-panel {
    position: relative;
    width: 100%;
    max-width: 420px;
    max-height: 78vh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -10px 34px rgba(0,0,0,0.28);
    animation: install-gate-slide-up 0.22s ease-out;
  }
  .info-sheet-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .info-sheet-title {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
  }
  .info-sheet-close {
    width: 30px; height: 30px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .info-sheet-body {
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
  }
  .row-info { min-width: 0; flex: 1; }
  .row-name { font-size: 14px; font-weight: 500; margin: 0; word-break: break-word; position: relative; z-index: 0; }
  .row-click-zone:active ~ .row-info .row-name { opacity: 0.6; }
  .row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 1px; }
  .row-price { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .calc-toggle {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .calc-toggle:active { background: var(--accent-bg); }
  .share-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .share-btn svg { width: 16px; height: 16px; display: block; }
  .share-btn:active { background: var(--accent-bg); color: var(--accent); }
  .calc-panel {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 13px;
    color: var(--text-secondary);
  }
  .calc-panel.open { display: flex; }
  .calc-panel input.calc-input {
    width: 62px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
    background: var(--card);
    color: var(--text);
  }
  .calc-result { font-weight: 700; color: var(--accent); }
  .calc-modes { display: flex; gap: 4px; }
  .calc-mode-btn {
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .calc-mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .calc-currency { display: flex; gap: 4px; }
  .calc-cur-btn {
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .calc-cur-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
  .calc-eq { font-weight: 600; }
  .calc-base { font-weight: 600; color: var(--text); white-space: nowrap; }
  .count { font-size: 12px; color: var(--text-secondary); padding: 8px 2px 4px; }

  /* ---------- Коди помилок Mitsubishi Heavy Industries (розділ "Інфо") ---------- */
  .mhi-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .mhi-block-title { font-size: 13.5px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .mhi-hint { font-size: 13px; color: var(--text-secondary); line-height: 1.55; }
  .mhi-field { margin-bottom: 10px; }
  .mhi-field:last-of-type { margin-bottom: 0; }
  .mhi-label {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .mhi-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .mhi-dot-run { background: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,0.15); }
  .mhi-dot-timer { background: #D97706; box-shadow: 0 0 0 3px rgba(217,119,6,0.15); }
  .mhi-select, .mhi-code-input { width: 100%; box-sizing: border-box; }
  .mhi-search-btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 4px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .mhi-search-btn:active { opacity: 0.88; }
  .mhi-btn-row { display: flex; gap: 8px; margin-top: 4px; }
  .mhi-btn-row .mhi-search-btn { margin-top: 0; flex: 1 1 auto; }
  .mhi-clear-btn {
    display: block;
    flex: 0 0 auto;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .mhi-clear-btn:active { opacity: 0.7; }
  .mhi-result-loading { text-align: center; color: var(--text-secondary); font-size: 13px; padding: 14px 0; }
  .mhi-result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .mhi-result + .mhi-result { margin-top: 10px; }
  .mhi-result-scope {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(230, 0, 18, 0.08);
    border-radius: 8px;
    padding: 8px 10px;
    line-height: 1.4;
    margin-bottom: 12px;
  }
  .mhi-result-empty { color: var(--text-secondary); font-size: 13.5px; line-height: 1.55; text-align: center; padding: 8px 4px; }
  .mhi-result-code {
    display: inline-block;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    background: var(--navy);
    padding: 4px 12px;
    border-radius: 8px;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  .mhi-result-name { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
  .mhi-result-section-title {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin: 14px 0 6px;
  }
  .mhi-result-checks { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--text); line-height: 1.6; }
  .mhi-result-checks li { margin-bottom: 4px; }
  .mhi-result-equip { font-size: 13.5px; color: var(--text); }
  .mhi-result-source { font-size: 11px; color: var(--text-secondary); margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }

  /* ---------- "Підбірка" (кошик): галочка біля рядка + плаваюча кнопка + панель ---------- */
  .cart-check-btn {
    position: relative;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    opacity: 0.45;
  }
  .cart-check-btn .cart-check-icon { font-size: 12px; font-weight: 700; color: var(--text-secondary); line-height: 1; }
  .cart-check-btn.active { opacity: 1; background: var(--accent); border-color: var(--accent); }
  .cart-check-btn.active .cart-check-icon { color: #fff; }
  .cart-check-badge {
    position: absolute;
    top: -6px; right: -6px;
    min-width: 15px; height: 15px;
    padding: 0 3px;
    border-radius: 8px;
    background: var(--navy);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  /* Підказка з'являється прямо під шапкою (шапка — position: sticky, тому підказка
     лишається зверху екрана, а не десь знизу, де її легко не помітити). */
  .cart-toast {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    margin-top: 6px;
    background: rgba(15,23,42,0.92);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 20px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    max-width: 70%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 6px 16px rgba(0,0,0,0.22);
  }
  .cart-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* "Ручка" підбірки — не плаваюча кнопка знизу, а яскравий "хвостик", що звисає з шапки
     праворуч. Лічильник завжди на видному місці зверху; повторний дотик ховає підбірку. */
  .cart-fab {
    position: absolute;
    top: 100%;
    right: 14px;
    display: none;
    align-items: center;
    gap: 6px;
    border: none;
    background: linear-gradient(135deg, #FF8A1E, #FF3D5A);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px 9px;
    border-radius: 0 0 14px 14px;
    cursor: pointer;
    box-shadow: 0 6px 14px -3px rgba(255, 61, 90, 0.55);
    z-index: 20;
  }
  .cart-fab-badge {
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: rgba(255,255,255,0.3);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* Панель підбірки опускається згори (не спливає знизу) — щоб рахувати натискання
     "ручки" зверху як єдину дію відкрити/закрити. */
  .cart-panel-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2600;
    align-items: flex-start;
    justify-content: center;
  }
  .cart-panel-overlay.show { display: flex; }
  .cart-panel-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.45); }
  .cart-panel {
    position: relative;
    width: 100%;
    max-width: 420px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-radius: 0 0 20px 20px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.28);
    animation: cart-panel-slide-down 0.22s ease-out;
    padding-top: env(safe-area-inset-top);
  }
  @keyframes cart-panel-slide-down {
    from { transform: translateY(-24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .cart-panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .cart-panel-title { flex: 1; font-size: 15px; font-weight: 700; color: var(--text); }
  .cart-panel-close {
    width: 30px; height: 30px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .cart-panel-body {
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cart-item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
  }
  .cart-item-name { flex: 1; font-size: 13px; min-width: 0; word-break: break-word; }
  .cart-item-tile { display: block; font-size: 10.5px; color: var(--text-secondary); font-weight: 500; }
  .cart-item-price { color: var(--text-secondary); font-weight: 600; }
  .cart-qty { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .cart-qty-btn {
    width: 24px; height: 24px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--card);
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
  }
  .cart-qty-val { min-width: 14px; text-align: center; font-weight: 600; }
  .cart-item-remove {
    width: 24px; height: 24px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    flex-shrink: 0;
  }
  .cart-total-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .cart-total-row .calc-panel { display: flex; flex: 1; margin-top: 0; padding-top: 0; border-top: none; }
  /* Калькулятор підбірки — окрема "рівняння"-розкладка (щоб підсумок після "=" не виходив
     за межі і не з'їжджав): ціна + форма% = число зверху, режими під формою, валюта під
     числом знизу. Потрійна специфічність (.calc-panel.cart-calc-panel.open), щоб надійно
     перебити і базовий display:flex з .calc-panel.open, і .cart-total-row .calc-panel. */
  .calc-panel.cart-calc-panel.open {
    display: grid;
    grid-template-columns: auto minmax(56px, 76px) auto 1fr;
    column-gap: 8px;
    row-gap: 6px;
    align-items: center;
    width: 100%;
  }
  .cart-calc-panel .calc-base { grid-column: 1; grid-row: 1; }
  .cart-calc-panel .calc-input { grid-column: 2; grid-row: 1; width: 100%; box-sizing: border-box; }
  .cart-calc-panel .calc-eq { grid-column: 3; grid-row: 1; }
  .cart-calc-panel .calc-result {
    grid-column: 4; grid-row: 1;
    text-align: right;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .cart-calc-panel .calc-modes { grid-column: 2; grid-row: 2; }
  .cart-calc-panel .calc-currency { grid-column: 4; grid-row: 2; justify-content: flex-end; }
  .cart-clear-btn {
    margin-top: 10px;
    padding: 11px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .cart-clear-btn:active { opacity: 0.85; }
  .cart-empty-hint { font-size: 12.5px; color: var(--text-secondary); margin: 4px 0; text-align: center; }

  .error {
    background: #fcebeb;
    color: var(--danger);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 10px;
  }
  .warn {
    background: #faeeda;
    color: #854f0b;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12px;
    margin-top: 10px;
    line-height: 1.5;
  }

  /* Branches / contacts */
  .branch-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
  }
  .branch-name { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .branch-line { font-size: 13px; color: var(--text-secondary); margin: 4px 0; line-height: 1.4; }
  .branch-line a { color: var(--accent); text-decoration: none; font-weight: 500; }

  /* Promotions */
  .promo-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .promo-image { width: 100%; display: block; height: auto; max-height: 80vh; object-fit: contain; background: var(--bg); }
  .promo-body { padding: 14px 16px; }
  .promo-title { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .promo-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 6px; }
  .promo-meta { font-size: 12px; color: var(--accent); font-weight: 500; }
  .promo-pdf-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .promo-upload-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .promo-upload-title { font-size: 14px; font-weight: 600; margin: 0; }
  .promo-upload-label { font-size: 12px; color: var(--text-secondary); margin: 2px 0 -4px; }
  .promo-upload-card input[type="text"],
  .promo-upload-card input[type="file"] {
    display: block;
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    color: var(--text);
    font-family: inherit;
    box-sizing: border-box;
  }
  .promo-upload-btn {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .promo-upload-btn:disabled { opacity: 0.6; cursor: default; }
  .promo-upload-status { font-size: 12px; color: var(--text-secondary); margin: 0; min-height: 14px; }
  .promo-image { cursor: zoom-in; }
  .promo-delete-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #f0cccc;
    background: var(--bg);
    color: var(--danger);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .promo-doc-note { font-size: 12px; color: var(--text-secondary); margin: -4px 0 0; }

  /* Інфо → Каталоги: картка з посиланням на PDF-каталог виробника */
  .info-doc-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .info-doc-link {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
  }
  .info-doc-link:active { color: var(--accent); }
  .info-doc-btn {
    display: block;
    text-align: center;
    padding: 11px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }

  /* Перегляд зображення акції на весь екран (наближення/панорамування) */
  .img-lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.94);
    z-index: 1000;
    flex-direction: column;
  }
  .img-lightbox-overlay.active { display: flex; }
  .img-lightbox-topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .img-lightbox-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
  }
  .img-lightbox-btn:active { background: rgba(255,255,255,0.28); }
  .img-lightbox-stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-lightbox-stage img {
    max-width: 92%;
    max-height: 92%;
    transform-origin: center center;
    will-change: transform;
    cursor: grab;
    -webkit-user-drag: none;
    user-select: none;
  }

  /* Cabinet */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  .primary-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.6; }
  .status-card {
    background: var(--accent-bg);
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
  }
  .status-card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .status-card-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    margin-top: 14px;
  }

  /* Auth (login/register) */
  .auth-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    background: var(--bg);
    border-radius: 10px;
    padding: 4px;
  }
  .auth-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 9px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
  }
  .auth-toggle button.active {
    background: var(--card);
    color: var(--accent);
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .logout-btn {
    width: 100%;
    padding: 11px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--danger);
    cursor: pointer;
    margin-top: 18px;
    font-family: inherit;
  }
  .joke-banner {
    background: var(--accent-bg);
    color: var(--accent);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 14px;
  }
  .joke-note {
    font-size: 12px;
    color: var(--text-secondary);
    text-align: center;
    margin-top: 10px;
    line-height: 1.5;
  }
  .push-status {
    background: var(--accent-bg);
    color: var(--accent);
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 14px;
  }
  .push-enable-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 14px;
  }
  .field .phone-input-row {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    overflow: hidden;
  }
  .phone-input-row .phone-prefix {
    padding: 11px 8px 11px 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }
  .field .phone-input-row input {
    border: none;
    border-radius: 0;
    width: auto;
    flex: 1;
    padding: 11px 12px 11px 8px;
    background: transparent;
  }
  .field .phone-input-row input:focus { outline: none; }

  /* Admin panel */
  .admin-section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--text-secondary);
    padding: 16px 2px 8px;
  }
  .admin-section-title:first-child { padding-top: 0; }
  .admin-search { margin-bottom: 10px; }
  .user-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .user-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .user-card-name { font-size: 14px; font-weight: 600; margin: 0; }
  .user-card-sub { font-size: 12px; color: var(--text-secondary); margin: 3px 0 0; line-height: 1.4; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-pending { background: #faeeda; color: #854f0b; }
  .badge-approved { background: var(--accent-bg); color: var(--accent); }
  .badge-rejected, .badge-blocked { background: #fcebeb; color: var(--danger); }
  .user-card-row { display: flex; gap: 6px; margin-top: 8px; }
  .user-card-row select { flex: 1; font-size: 12px; padding: 7px 6px; }
  .user-card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .user-card-actions button {
    flex: 1;
    min-width: 90px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
  }
  .user-card-actions button.approve { background: var(--accent); color: #fff; border-color: var(--accent); }
  .user-card-actions button.reject { color: var(--danger); border-color: #f0cccc; }
</style>
</head>
<body>
<div class="install-banner" id="install-banner">
  <div class="install-banner-text" id="install-banner-text"></div>
  <button id="install-action-btn" style="display:none;">Встановити</button>
  <button class="close-x" id="install-close-btn">✕</button>
</div>

<div class="install-gate" id="install-gate">
  <div class="install-gate-backdrop"></div>
  <div class="install-gate-sheet" id="install-gate-sheet"></div>
</div>
<div class="app">
  <header>
    <div class="header-top">
      <div class="back-btn" id="back-btn">←</div>
      <h1 id="title">Каталог Sun-Ice</h1>
      <div class="icon-btn" id="refresh-icon" title="Оновити прайс" style="display:none;">↻</div>
      <div class="icon-btn icon-btn-text" id="shortcut-icon" title="Встановити застосунок на головний екран" style="display:none;">Встановити</div>
    </div>
    <div class="rate-row" id="rate-row" style="display:none;">
      <span class="rate-label">Курс $:</span>
      <span class="rate-value" id="rate-value">—</span>
      <input type="number" class="rate-input" id="rate-input" step="0.01" min="0" style="display:none;">
      <button type="button" class="rate-edit-btn" id="rate-edit-btn" style="display:none;" aria-label="Редагувати курс">✎</button>
      <button type="button" class="rate-save-btn" id="rate-save-btn" style="display:none;" aria-label="Зберегти курс">✓</button>
    </div>
    <div class="status-row" id="status-row" style="display:none;">
      <div class="status-text" id="status-text"></div>

/* ---------- Допоміжні функції парсингу прайсу ---------- */
const priceKeywordGroups = [
  ['ціна дилер', 'цена дилер', 'dealer price'],
  ['роздрібна ціна', 'розничная цена', 'retail price'],
  ['ціна', 'цена', 'price', 'стоимость']
];
const modelKeywords = ['модель', 'маркировка', 'маркування', 'артикул', 'sku', 'model', 'найменування', 'наименование'];
const internalKeywords = ['внутрішній', 'внутренний', 'indoor'];
const externalKeywords = ['зовнішній', 'наружный', 'outdoor'];
const unitTypeKeywords = ['тип блоку', 'тип блока'];
const totalSubKeywords = ['комплект', 'всього', 'разом', 'итого', 'total'];
const categoryStems = ['настінн', 'стельов', 'касетн', 'канальн', 'колонн', 'підлогов', 'підвісн', 'шафов'];
const PALETTE = ['#dbeafe', '#dcfce7', '#fef9c3', '#fce7f3', '#ede9fe', '#ffedd5', '#ccfbf1', '#fee2e2'];

function norm(v) { return String(v == null ? '' : v).toLowerCase().trim(); }
function cellContainsAny(v, keywords) {
  const s = norm(v);
  if (!s) return false;
  return keywords.some(k => s.includes(k));
}
function parseNumber(val) {
  if (typeof val === 'number') return isFinite(val) ? val : null;
  if (!val) return null;
  const s = String(val).trim();
  if (!s) return null;
  const cleaned = s.replace(/\s/g, '').replace(/[^\d.,-]/g, '').replace(',', '.');
  const num = parseFloat(cleaned);
  return isNaN(num) ? null : num;
}
function detectCurrency(headerText) {
  const s = norm(headerText);
  if (s.includes('грн')) return 'грн';
  if (s.includes('у.е') || s.includes('$')) return '$';
  if (s.includes('₴')) return '₴';
  return '';
}
function findPriceHeader(rows) {
  for (const group of priceKeywordGroups) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r] || [];
      for (let c = 0; c < row.length; c++) {
        if (cellContainsAny(row[c], group)) return { row: r, col: c, text: row[c] };
      }
    }
  }
  return null;
}
function findColumnInRow(row, keywords) {
  if (!row) return -1;
  for (let c = 0; c < row.length; c++) {
    if (cellContainsAny(row[c], keywords)) return c;
  }
  return -1;
}
function extractSeries(model) {
  if (!model) return null;
  const first = model.split(/[\s+]/)[0];
  const m = first.match(/^[A-ZА-ЯІЇЄ]+-?(\d+)([A-ZА-ЯІЇЄ]+)/i);
  return m ? m[2].toUpperCase() : null;
}
function isCategoryLabel(text) {
  const s = norm(text);
  if (!s) return false;
  return categoryStems.some(stem => s.includes(stem));
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function parseSheet(rows, highlightMode, opts) {
  opts = opts || {};
  const seriesLabelMode = opts.seriesLabelMode || null; // 'first-sentence' (GALACTIC)
  const labelMap = opts.labelSequence
    ? new Map(opts.labelSequence.map(e => [e.fromModel, e.label]))
    : null; // ручний список підписів серій за кодом моделі (MHI, див. SPLIT_MHI_LABELS)

  const priceHeader = findPriceHeader(rows);
  if (!priceHeader) return { items: [], error: 'Не знайдено колонку з ціною' };

  let priceCol = priceHeader.col;
  let dataStart = priceHeader.row + 1;
  const nextRow = rows[priceHeader.row + 1];
  if (nextRow) {
    for (let c = priceCol; c < nextRow.length; c++) {
      if (cellContainsAny(nextRow[c], totalSubKeywords)) {
        priceCol = c;
        dataStart = priceHeader.row + 2;
        break;
      }
    }
  }

  const headerRow = rows[priceHeader.row] || [];
  const headerRowAbove = rows[priceHeader.row - 1] || [];
  let modelCol = findColumnInRow(headerRow, modelKeywords);
  if (modelCol === -1) modelCol = findColumnInRow(headerRowAbove, modelKeywords);

  const internalCol = findColumnInRow(headerRow, internalKeywords);
  const externalCol = findColumnInRow(headerRow, externalKeywords);
  const unitTypeCol = findColumnInRow(headerRow, unitTypeKeywords);
  const currency = detectCurrency(priceHeader.text);
  const items = [];
  let currentCategory = null;
  let currentSeriesLabel = null;
  let currentFullText = null; // повний опис серії з прайсу — для спливаючого вікна "детальніше"

  for (let r = dataStart; r < rows.length; r++) {
    const row = rows[r] || [];
    const price = parseNumber(row[priceCol]);

    if (price === null && highlightMode === 'category' && modelCol !== -1) {
      const labelText = String(row[modelCol] || '').trim();
      const hasInternal = internalCol !== -1 && row[internalCol];
      const hasExternal = externalCol !== -1 && row[externalCol];
      if (labelText && !hasInternal && !hasExternal && isCategoryLabel(labelText)) {
        currentCategory = labelText;
      }
    }

    if (price === null && highlightMode === 'series' && modelCol !== -1) {
      const cellText = String(row[modelCol] || '').trim();
      if (seriesLabelMode === 'first-sentence' && cellText.includes('.')) {
        // Рядок-опис серії (GALACTIC): весь текст жирний, беремо перше речення до крапки
        // для короткого підпису, а весь текст рядка зберігаємо для вікна "детальніше".
        const firstSentence = cellText.split('.', 1)[0].trim();
        if (firstSentence.length > 12) {
          currentSeriesLabel = firstSentence + '.';
          currentFullText = cellText;
        }
      } else if (labelMap && cellText.length > 8) {
        // MHI: короткий підпис — за ручним списком SPLIT_MHI_LABELS (нижче), а повний
        // текст опису серії беремо як є з цього рядка прайсу (без жодної обробки) —
        // саме він піде у спливаюче вікно "детальніше".
        currentFullText = cellText;
      }
    }

    if (price === null) continue;

    let model = modelCol !== -1 ? String(row[modelCol] || '').trim() : '';
    if (!model && internalCol !== -1) {
      const parts = [row[internalCol], row[externalCol]].filter(v => v && String(v).trim());
      model = parts.map(v => String(v).trim()).join(' + ');
    }
    if (!model) continue;

    // MHI (ПОБУТОВІ): підпис серії — за ручним списком SPLIT_MHI_LABELS, прив'язаним
    // до конкретного коду моделі, з якого починається серія/під-група.
    if (labelMap && labelMap.has(model)) currentSeriesLabel = labelMap.get(model);

    const item = { model, price, currency };
    if (highlightMode === 'series') {
      item.groupKey = extractSeries(model);
      if (seriesLabelMode || labelMap) {
        item.groupLabel = currentSeriesLabel || null;
        item.groupFullText = currentFullText || null;
      }
    } else if (highlightMode === 'category') item.groupKey = currentCategory;
    // Тип блоку (зовнішній/внутрішній) — потрібен для конфігуратора мультисплітів.
    // Колонку "ТИП БЛОКУ" мають лише аркуші МУЛЬТИСИСТЕМИ/GALACTIC, для решти
    // прайсів unitTypeCol === -1 і item.unitType просто не проставляється.
    if (unitTypeCol !== -1) {
      const typeText = norm(row[unitTypeCol]);
      if (typeText.includes('зовніш') || typeText.includes('наруж')) item.unitType = 'outdoor';
      else if (typeText.includes('внутр')) item.unitType = 'indoor';
      else item.unitType = null;
    }
    items.push(item);
  }

  if (highlightMode) {
    const colorMap = new Map();
    items.forEach(it => {
      if (!it.groupKey) return;
      if (!colorMap.has(it.groupKey)) colorMap.set(it.groupKey, PALETTE[colorMap.size % PALETTE.length]);
      it.color = colorMap.get(it.groupKey);
    });
  }

  return { items, error: items.length === 0 ? 'Не знайдено рядків з маркуванням і ціною' : null };
}

function sliceBySplitMarker(rows, marker, side) {
  const idx = rows.findIndex(row => (row || []).some(cell => norm(cell).includes(marker)));
  if (idx === -1) return rows; // маркер не знайдено — повертаємо все як є
  return side === 'after' ? rows.slice(idx) : rows.slice(0, idx);
}

function buildSheetsData(wb) {
  const data = {};
  const problems = [];

  CATALOG_TILES.forEach(tile => {
    ['mhi', 'gal'].forEach(brand => {
      const cfg = tile[brand];
      if (!cfg) return;
      if (!wb.SheetNames.includes(cfg.sheet)) {
        problems.push(tile.label + ' / ' + brand.toUpperCase() + ' (вкладку "' + cfg.sheet + '" не знайдено у файлі)');
        return;
      }
      const sheet = wb.Sheets[cfg.sheet];
      let rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (cfg.splitMarker) rows = sliceBySplitMarker(rows, cfg.splitMarker, cfg.splitSide);
      const result = parseSheet(rows, cfg.highlight, { seriesLabelMode: cfg.seriesLabelMode, labelSequence: cfg.labelSequence });
      if (result.items.length > 0) {
        if (cfg.baseAdjustPct) {
          const factor = 1 - cfg.baseAdjustPct / 100;
          result.items.forEach(it => { it.price = it.price * factor; });
        }
        data[cfg.key] = result.items;
      } else {
        problems.push(tile.label + ' / ' + brand.toUpperCase() + (result.error ? ' (' + result.error + ')' : ''));
      }
    });
  });

  return { data, problems };
}

/* ---------- Кеш прайсу (локально на пристрої) ---------- */
/* PARSER_VERSION — версія ЛОГІКИ розбору прайсу (не самого файлу price.xlsx).
   Якщо на телефоні користувача вже лежить закешований розібраний прайс зі старою
   версією логіки (наприклад, до того як з'явились підписи серій) — кеш ігнорується
   і прайс перечитується наново, навіть якщо сам price.xlsx на сервері не змінювався.
   Піднімай цю цифру щоразу, коли міняєш buildSheetsData/parseSheet так, що це впливає
   на те, що саме зберігається в sheetsData — інакше користувачі з уже завантаженим
   кешем не побачать змін, поки хтось не перезалить прайс на Supabase. */
const PARSER_VERSION = 3;

function loadProcessedCache() {
  try {
    const raw = localStorage.getItem('sunice_price_cache');
    if (!raw) return false;
    const cached = JSON.parse(raw);
    if (!cached || !cached.data) return false;
    if (cached.parserVersion !== PARSER_VERSION) return false; // логіка розбору змінилась — треба перечитати
    sheetsData = cached.data;
    priceVersion = cached.version || null;
    setCatalogStatus('Востаннє оновлено: ' + new Date(cached.savedAt).toLocaleString('uk-UA') + (priceVersion ? ' · версія ' + priceVersion : ''));
    return true;
  } catch (e) {
    return false;
  }
}
function persistProcessedCache(version) {
  try {
    localStorage.setItem('sunice_price_cache', JSON.stringify({ data: sheetsData, version, savedAt: Date.now(), parserVersion: PARSER_VERSION }));
  } catch (e) {}
}

async function checkPriceVersion() {
  try {
    const { data, error } = await sb.from('price_meta').select('version, updated_at').eq('id', 1).single();
    if (error || !data) return null;
    return data;
  } catch (e) {
    return null;
  }
}

async function downloadAndParsePrice() {
  const res = await fetch(PRICE_FILE_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
  const { data, problems } = buildSheetsData(wb);
  sheetsData = data;
  const errBlock = document.getElementById('error-block');
  errBlock.innerHTML = problems.length
    ? '<div class="warn">Не вдалося розпізнати: ' + escapeHtml(problems.join(', ')) + '</div>'
    : '';
}

function setCatalogStatus(text) {
  const row = document.getElementById('status-row');
  const el = document.getElementById('status-text');
  if (!text) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  el.textContent = text;
}

/* ---------- Курс долара в шапці каталогу (редагують regional_admin/super_admin) ---------- */
async function loadExchangeRate() {
  try {
    const { data } = await sb.from('app_settings').select('usd_rate').eq('id', 1).single();
    usdRate = data && data.usd_rate != null ? Number(data.usd_rate) : null;
  } catch (e) {
    usdRate = null;
  }
  try {
    const role = await getCurrentProfileRole();
    canEditRate = role === 'regional_admin' || role === 'super_admin';
  } catch (e) {
    canEditRate = false;
  }
  renderRateRow();
}
function renderRateRow() {
  const row = document.getElementById('rate-row');
  if (!row) return;
  const show = currentTab === 'catalog' && activeTile === null;
  row.style.display = show ? 'flex' : 'none';
  if (!show) return;
  document.getElementById('rate-value').textContent = usdRate ? usdRate.toLocaleString('uk-UA') + ' ₴' : 'не встановлено';
  document.getElementById('rate-edit-btn').style.display = canEditRate ? 'flex' : 'none';
}

async function initCatalog() {
  document.getElementById('refresh-icon').style.display = 'flex';
  loadExchangeRate();
  const hadCache = loadProcessedCache();
  if (hadCache) {
    renderCatalogView();
    return;
  }
  setCatalogStatus('Завантаження прайсу...');
  renderCatalogView();
  try {
    const meta = await checkPriceVersion();
    await downloadAndParsePrice();
    priceVersion = meta ? meta.version : 1;
    persistProcessedCache(priceVersion);
    setCatalogStatus('Завантажено: ' + new Date().toLocaleString('uk-UA') + (meta ? ' · версія ' + priceVersion : ''));
  } catch (e) {
    setCatalogStatus('Немає підключення до інтернету. Прайс ще не завантажено.');
  }
  renderCatalogView();
}

async function handleRefreshClick() {
  setCatalogStatus('Перевірка оновлень...');
  const meta = await checkPriceVersion();
  if (!meta) {
    setCatalogStatus('Не вдалося перевірити оновлення. Перевірте інтернет-з’єднання.');
    return;
  }
  if (priceVersion !== null && meta.version === priceVersion) {
    setCatalogStatus('Прайс актуальний (версія ' + meta.version + ')');
    return;
  }
  setCatalogStatus('Завантаження нового прайсу...');
  try {
    await downloadAndParsePrice();
    priceVersion = meta.version;
    persistProcessedCache(priceVersion);
    setCatalogStatus('Оновлено: ' + new Date().toLocaleString('uk-UA') + ' · версія ' + priceVersion);
    renderCatalogView();
  } catch (e) {
    setCatalogStatus('Немає підключення. Відображається остання завантажена версія прайсу.');
  }
}

function tileActiveCfg(tile) {

/* ---------- Калькулятор ціни в рядку прайсу / підсумку мультиспліту ---------- */
/* Три режими: відняти % (знижка), додати % (маржа), або ввести кінцеву суму напряму.
   Плюс вибір валюти показу — нативна валюта прайсу ($) або перерахунок у гривню за
   курсом з шапки каталогу (usdRate), який редагують адміни/суперадміни. */
function convertAmount(amount, fromCur, toCur, rate) {
  if (fromCur === toCur || !toCur) return amount;
  if (fromCur === '$' && toCur === 'UAH') return rate ? amount * rate : amount;
  if (fromCur === 'UAH' && toCur === '$') return rate ? amount / rate : amount;
  return amount;
}
function formatCalcAmount(amount, cur) {
  const suffix = cur === 'UAH' ? ' ₴' : (cur ? ' ' + cur : '');
  return Math.round(amount).toLocaleString('uk-UA') + suffix;
}
function buildCalcPanelHtml(price, currency, priceStr, opts) {
  opts = opts || {};
  const curBtnsHtml = currency === '$' ? `
            <div class="calc-currency">
              <button type="button" class="calc-cur-btn active" data-cur="$">$</button>
              <button type="button" class="calc-cur-btn" data-cur="UAH">₴</button>
            </div>` : '';
  const cls = 'calc-panel' + (opts.open ? ' open' : '') + (opts.extraClass ? ' ' + opts.extraClass : '');
  // showBase: показати базову ціну як окремий елемент рівняння "ціна + форма% = число"
  // (використовується в калькуляторі підбірки, де це важливо бачити явно).
  const baseHtml = opts.showBase ? `<span class="calc-base">${priceStr}</span>` : '';
  return `
          <div class="${cls}" data-price="${price}" data-currency="${escapeHtml(currency || '')}" data-mode="sub" data-cur="${escapeHtml(currency || '')}">
            ${baseHtml}
            <div class="calc-modes">
              <button type="button" class="calc-mode-btn active" data-mode="sub">−%</button>
              <button type="button" class="calc-mode-btn" data-mode="add">+%</button>
              <button type="button" class="calc-mode-btn" data-mode="flat">=Ціна</button>
            </div>
            <input type="number" class="calc-input" min="0" inputmode="numeric" placeholder="">${curBtnsHtml}
            <span class="calc-eq">=</span>
            <span class="calc-result">${priceStr}</span>
          </div>`;
}
function computeCalcResult(panel) {
  if (!panel) return;
  const price = parseFloat(panel.getAttribute('data-price')) || 0;
  const nativeCur = panel.getAttribute('data-currency') || '';
  const mode = panel.getAttribute('data-mode') || 'sub';
  const cur = panel.getAttribute('data-cur') || nativeCur;
  const input = panel.querySelector('.calc-input');
  let val = input ? parseFloat(input.value) : NaN;
  if (isNaN(val) || val < 0) val = 0;

  let result;
  if (mode === 'flat' && val > 0) {
    result = val;
  } else {
    const amountNative = mode === 'add' ? price * (1 + val / 100) : price * (1 - val / 100);
    result = convertAmount(amountNative, nativeCur, cur, usdRate);
  }
  const resultEl = panel.querySelector('.calc-result');
  if (resultEl) resultEl.textContent = formatCalcAmount(result, cur);
}

/* Спільна логіка кнопок режиму (-%/+%/=Ціна) і валюти ($/₴) калькулятора — використовується
   і для калькулятора в рядку прайсу (всередині #main), і для калькулятора підбірки
   (всередині #cart-panel-overlay, це окремий контейнер поза #main). Повертає true, якщо
   подія оброблена (щоб виклик міг одразу зробити return). */
function handleCalcDelegatedClick(e) {
  const modeBtn = e.target.closest('.calc-mode-btn');
  if (modeBtn) {
    const panel = modeBtn.closest('.calc-panel');
    panel.querySelectorAll('.calc-mode-btn').forEach(b => b.classList.toggle('active', b === modeBtn));
    panel.setAttribute('data-mode', modeBtn.getAttribute('data-mode'));
    computeCalcResult(panel);
    return true;
  }
  const curBtn = e.target.closest('.calc-cur-btn');
  if (curBtn) {
    const panel = curBtn.closest('.calc-panel');
    panel.querySelectorAll('.calc-cur-btn').forEach(b => b.classList.toggle('active', b === curBtn));
    panel.setAttribute('data-cur', curBtn.getAttribute('data-cur'));
    computeCalcResult(panel);
    return true;
  }
  return false;
}
function handleCalcDelegatedInput(e) {
  if (!e.target.classList.contains('calc-input')) return false;
  computeCalcResult(e.target.closest('.calc-panel'));
  return true;
}

/* ---------- "Підбірка" (кошик) ----------
   Галочка біля рядка прайсу (.cart-check-btn) додає товар у cart[] і одразу оновлює
   тільки саму кнопку (без перерендеру всього списку — інакше гортання прайсу збивалось би
   при кожному натисканні). Плаваюча кнопка (#cart-fab) і панель (#cart-panel-overlay) —
   статичні елементи поза #main, що показуються лише коли підбірка не порожня. */
function cartQtyFor(key) {
  const entry = cart.find(c => c.key === key);
  return entry ? entry.qty : 0;
}
function cartTotalsByCurrency() {
  const totals = {};
  cart.forEach(c => { totals[c.currency || ''] = (totals[c.currency || ''] || 0) + c.price * c.qty; });
  return totals;
}
function addToCart(btn) {
  const key = btn.getAttribute('data-key');
  const model = btn.getAttribute('data-model');
  const price = parseFloat(btn.getAttribute('data-price')) || 0;
  const currency = btn.getAttribute('data-currency') || '';
  const tileLabel = btn.getAttribute('data-tile-label') || '';
  let entry = cart.find(c => c.key === key);
  if (!entry) {
    entry = { key, model, price, currency, tileLabel, qty: 0 };
    cart.push(entry);
  }
  entry.qty += 1;
  btn.classList.add('active');
  const badge = btn.querySelector('.cart-check-badge');
  if (badge) { badge.textContent = entry.qty; badge.style.display = 'flex'; }
  showCartToast(model, entry.qty);
  renderCartBar();
}
function showCartToast(model, qty) {
  const toast = document.getElementById('cart-toast');
  if (!toast) return;
  toast.textContent = model + ' — ' + qty + ' шт. Натисни знову — буде +1';
  toast.classList.add('show');
  if (cartToastTimer) clearTimeout(cartToastTimer);
  cartToastTimer = setTimeout(() => { toast.classList.remove('show'); }, 1800);
}
function syncCartRowBadge(key) {
  const main = document.getElementById('main');
  if (!main) return;
  const entry = cart.find(c => c.key === key);
  const qty = entry ? entry.qty : 0;
  main.querySelectorAll('.cart-check-btn').forEach(btn => {
    if (btn.getAttribute('data-key') !== key) return;
    const badge = btn.querySelector('.cart-check-badge');
    if (qty > 0) {
      btn.classList.add('active');
      if (badge) { badge.textContent = qty; badge.style.display = 'flex'; }
    } else {
      btn.classList.remove('active');
      if (badge) { badge.style.display = 'none'; badge.textContent = ''; }
    }
  });
}
function syncAllCartBadges() {
  const main = document.getElementById('main');
  if (!main) return;
  main.querySelectorAll('.cart-check-btn').forEach(btn => {
    btn.classList.remove('active');
    const badge = btn.querySelector('.cart-check-badge');
    if (badge) { badge.style.display = 'none'; badge.textContent = ''; }
  });
}
function renderCartBar() {
  const fab = document.getElementById('cart-fab');
  if (!fab) return;
  const totalQty = cart.reduce((s, c) => s + c.qty, 0);
  if (totalQty === 0 || currentTab !== 'catalog') {
    fab.style.display = 'none';
    if (totalQty === 0) closeCartPanel();
    return;
  }
  fab.style.display = 'flex';
  document.getElementById('cart-fab-badge').textContent = totalQty;
  if (document.getElementById('cart-panel-overlay').classList.contains('show')) renderCartPanel();
}
function renderCartPanel() {
  const body = document.getElementById('cart-panel-body');
  if (!body) return;
  if (cart.length === 0) {
    body.innerHTML = '<div class="cart-empty-hint">Підбірка порожня — натисни ✓ біля позиції в прайсі</div>';
    return;
  }
  const itemsHtml = cart.map(c => {
    const priceStr = formatCalcAmount(c.price * c.qty, c.currency);
    return `
      <div class="cart-item-row" data-key="${escapeHtml(c.key)}">
        <span class="cart-item-name">${escapeHtml(c.model)}${c.tileLabel ? '<span class="cart-item-tile">' + escapeHtml(c.tileLabel) + '</span>' : ''}<span class="cart-item-price">${priceStr}</span></span>
        <div class="cart-qty">
          <button type="button" class="cart-qty-btn" data-op="minus" aria-label="Менше">−</button>
          <span class="cart-qty-val">${c.qty}</span>
          <button type="button" class="cart-qty-btn" data-op="plus" aria-label="Більше">+</button>
        </div>
        <button type="button" class="cart-item-remove" aria-label="Видалити">✕</button>
      </div>`;
  }).join('');

  const totals = cartTotalsByCurrency();
  const currencies = Object.keys(totals);
  // Калькулятор з перерахунком валюти має сенс, лише коли всі позиції в одній валюті —
  // на практиці так завжди (весь прайс у $), але про всяк випадок обробляємо і змішаний.
  const singleCurrency = currencies.length === 1 ? currencies[0] : null;
  const totalsLineHtml = currencies.map(cur => formatCalcAmount(totals[cur], cur)).join(' + ');
  const calcHtml = singleCurrency !== null
    ? buildCalcPanelHtml(totals[singleCurrency], singleCurrency, formatCalcAmount(totals[singleCurrency], singleCurrency), { open: true, extraClass: 'cart-calc-panel', showBase: true })
    : `<div class="cart-empty-hint">Разом: ${totalsLineHtml}</div>`;

  body.innerHTML = itemsHtml + `
    <div class="cart-total-row">
      ${calcHtml}
      <button type="button" class="share-btn cart-share-btn" aria-label="Поділитися підбіркою"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><line x1="8.6" y1="10.6" x2="15.4" y2="6.6" stroke="#1E5A96" stroke-width="2" stroke-linecap="round"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.4" stroke="#1E5A96" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="12" r="3.3" fill="#7FC4EF" stroke="#0B3C6B" stroke-width="1.6"/><circle cx="18" cy="5.5" r="3.3" fill="#7FC4EF" stroke="#0B3C6B" stroke-width="1.6"/><circle cx="18" cy="18.5" r="3.3" fill="#7FC4EF" stroke="#0B3C6B" stroke-width="1.6"/></svg></button>
    </div>
    <button type="button" class="cart-clear-btn" id="cart-clear-btn">Очистити підбірку</button>
  `;
}
function openCartPanel() {
  renderCartPanel();
  document.getElementById('cart-panel-overlay').classList.add('show');
}
function closeCartPanel() {
  const overlay = document.getElementById('cart-panel-overlay');
  if (overlay) overlay.classList.remove('show');
}

function renderCatalogList() {
  const main = document.getElementById('main');
  openCalcPanelEl = null; // старі вузли DOM зараз буде замінено — посилання все одно застаріє

  const tile = CATALOG_TILES.find(t => t.id === activeTile);
  if (!tile) { main.innerHTML = '<div class="empty">Нічого не знайдено</div>'; return; }

  const hasBoth = !!(tile.mhi && tile.gal);
  const cfg = tileActiveCfg(tile);
  const toggleHtml = hasBoth ? `
    <div class="brand-toggle">
      <button type="button" class="brand-toggle-btn ${activeBrand === 'mhi' ? 'active' : ''}" data-brand="mhi">MHI</button>
      <button type="button" class="brand-toggle-btn ${activeBrand === 'gal' ? 'active' : ''}" data-brand="gal">GAL</button>
    </div>` : '';

  const allItems = cfg ? (sheetsData[cfg.key] || []) : [];

  if (!cfg || allItems.length === 0) {
    main.innerHTML = toggleHtml + '<div class="empty">Прайс для цього розділу ще не завантажено.</div>';
    attachBrandToggleHandlers(main);
    return;
  }

  const filtered = allItems;

  const countHtml = '<div class="count">Всього: ' + filtered.length + '</div>';
  const showSegments = true;
  let lastKey = null;
  seriesInfoTexts = [];

  const rowsHtml = filtered.map(it => {
    let header = '';
    // Заголовок сегмента показуємо за "ефективним" підписом (groupLabel, якщо є — інакше
    // короткий буквений код). Так під-підписи (напр. "Внутрішні кольорові"/"Зовнішні чорні"
    // всередині однієї серії ZT) теж створюють новий заголовок, навіть якщо колір і
    // groupKey лишаються тими самими.
    const effectiveKey = it.groupLabel || it.groupKey;
    if (showSegments && effectiveKey && effectiveKey !== lastKey) {
      lastKey = effectiveKey;
      // Клікабельним заголовок робимо, лише якщо повний опис з прайсу дає щось суттєво
      // більше за сам короткий підпис — щоб не показувати вікно, у якому просто
      // повторюється той самий короткий текст.
      const hasMoreInfo = it.groupFullText && it.groupFullText.trim().length > effectiveKey.length + 15;
      if (hasMoreInfo) {
        const idx = seriesInfoTexts.length;
        seriesInfoTexts.push({ title: effectiveKey, text: it.groupFullText.trim() });
        header = `<div class="segment-header segment-header-info" data-info-idx="${idx}" style="${it.color ? 'border-color:' + it.color : ''}">${escapeHtml(effectiveKey)}<span class="segment-header-info-icon">ⓘ</span></div>`;
      } else {
        header = `<div class="segment-header" style="${it.color ? 'border-color:' + it.color : ''}">${escapeHtml(effectiveKey)}</div>`;
      }
    } else if (showSegments && !effectiveKey) {
      lastKey = null;
    }
    const priceStr = Math.round(it.price).toLocaleString('uk-UA') + (it.currency ? ' ' + it.currency : '');
    const cartKey = activeTile + '|' + activeBrand + '|' + it.model;
    const cartQty = cartQtyFor(cartKey);
    return header + `
      <div class="row" style="${it.color ? 'background:' + it.color + ';border-color:transparent;' : ''}">
        <div class="row-top">
          <div class="row-click-zone" data-model="${escapeHtml(it.model)}" aria-label="Пошук в Google"></div>
          <div class="row-info">
            <p class="row-name">${escapeHtml(it.model)}</p>
          </div>
          <div class="row-right">
            <button class="cart-check-btn${cartQty > 0 ? ' active' : ''}" type="button" data-key="${escapeHtml(cartKey)}" data-model="${escapeHtml(it.model)}" data-price="${it.price}" data-currency="${escapeHtml(it.currency || '')}" data-tile-label="${escapeHtml(tile.label)}" aria-label="Додати в підбірку"><span class="cart-check-icon">✓</span><span class="cart-check-badge" style="${cartQty > 0 ? '' : 'display:none;'}">${cartQty || ''}</span></button>
            <button class="calc-toggle" type="button" aria-label="Розрахувати ціну">%</button>
            <div class="row-price">${priceStr}</div>
            <button class="share-btn" type="button" aria-label="Поділитися"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><line x1="8.6" y1="10.6" x2="15.4" y2="6.6" stroke="#1E5A96" stroke-width="2" stroke-linecap="round"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.4" stroke="#1E5A96" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="12" r="3.3" fill="#7FC4EF" stroke="#0B3C6B" stroke-width="1.6"/><circle cx="18" cy="5.5" r="3.3" fill="#7FC4EF" stroke="#0B3C6B" stroke-width="1.6"/><circle cx="18" cy="18.5" r="3.3" fill="#7FC4EF" stroke="#0B3C6B" stroke-width="1.6"/></svg></button>
          </div>
        </div>
        <div class="calc-panel-slot">${buildCalcPanelHtml(it.price, it.currency, priceStr)}</div>
      </div>
    `;
  }).join('');

  main.innerHTML = toggleHtml + countHtml + (filtered.length ? rowsHtml : '<div class="empty">Нічого не знайдено</div>');
  attachBrandToggleHandlers(main);
}

function attachBrandToggleHandlers(main) {
  main.querySelectorAll('.brand-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const brand = btn.getAttribute('data-brand');
      if (brand === activeBrand) return;
      activeBrand = brand;
      renderCatalogList();
    });
  });
}

function closeSeriesInfo() {

}
document.getElementById('series-info-close').addEventListener('click', closeSeriesInfo);
document.getElementById('series-info-backdrop').addEventListener('click', closeSeriesInfo);

document.getElementById('main').addEventListener('click', function(e) {
  if (currentTab !== 'catalog') return;
  const infoHeader = e.target.closest('.segment-header-info');
  if (infoHeader) {
    const info = seriesInfoTexts[Number(infoHeader.getAttribute('data-info-idx'))];
    if (info) openSeriesInfo(info.title, info.text);
    return;
  }
  const zoneEl = e.target.closest('.row-click-zone');
  if (zoneEl) {
    const model = zoneEl.getAttribute('data-model');
    if (model) window.open('https://www.google.com/search?q=' + encodeURIComponent(model), '_blank');
    return;
  }
  const toggleBtn = e.target.closest('.calc-toggle');
  if (toggleBtn) {
    const rowEl = toggleBtn.closest('.row');
    const panel = rowEl.querySelector('.calc-panel');
    if (panel) {
      const willOpen = !panel.classList.contains('open');
      if (openCalcPanelEl && openCalcPanelEl !== panel) openCalcPanelEl.classList.remove('open');
      panel.classList.toggle('open', willOpen);
      openCalcPanelEl = willOpen ? panel : null;
      calcPanelOpenedAt = Date.now();
      if (willOpen) {
        const input = panel.querySelector('.calc-input');
        if (input) input.focus();
      }
    }
    return;
  }
  if (handleCalcDelegatedClick(e)) return;
  const shareBtn = e.target.closest('.share-btn');
  if (shareBtn) {
    const rowEl = shareBtn.closest('.row');
    const nameEl = rowEl.querySelector('.row-name');
    const panel = rowEl.querySelector('.calc-panel');
    const resultEl = panel ? panel.querySelector('.calc-result') : null;
    const basePriceEl = rowEl.querySelector('.row-price');
    const priceText = (resultEl ? resultEl.textContent : (basePriceEl ? basePriceEl.textContent : '')).trim();
    const model = nameEl ? nameEl.textContent.trim() : '';
    const shareText = model + ' — ' + priceText;
    if (navigator.share) {
      navigator.share({ text: shareText }).catch(() => {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareText).then(() => {
        const oldHTML = shareBtn.innerHTML;
        shareBtn.innerHTML = '✓';
        setTimeout(() => { shareBtn.innerHTML = oldHTML; }, 1200);
      }).catch(() => {});
    }
    return;
  }
  const cartBtn = e.target.closest('.cart-check-btn');
  if (cartBtn) {
    addToCart(cartBtn);
    return;
  }
});
document.getElementById('main').addEventListener('input', handleCalcDelegatedInput);

/* Калькулятор у рядку прайсу сам згортається: дотик поза розкритою формою (в тому числі
   в порожню область того самого рядка), або гортання списку — і панель знову маленька.
   Слухач у фазі "capture", щоб спрацювати ДО кліку по кнопці % іншого рядка (тоді стара
   панель встигає закритись, перш ніж відкриється нова). Власну кнопку %, яка й керує
   відкриттям/закриттям цієї ж панелі, тут навмисно ігноруємо — нею керує toggleBtn-гілка
   вище. */
document.addEventListener('click', function(e) {
  if (!openCalcPanelEl) return;
  if (openCalcPanelEl.contains(e.target)) return;
  const rowEl = openCalcPanelEl.closest('.row');
  const ownToggle = rowEl ? rowEl.querySelector('.calc-toggle') : null;
  if (ownToggle && e.target.closest('.calc-toggle') === ownToggle) return;
  openCalcPanelEl.classList.remove('open');
  openCalcPanelEl = null;
}, true);
window.addEventListener('scroll', function() {
  // Невелика затримка після відкриття — інакше авто-прокрутка сторінки до фокусу на
  // мобільній клавіатурі одразу ж закривала б щойно відкриту панель.
  if (openCalcPanelEl && Date.now() - calcPanelOpenedAt > 400) {
    openCalcPanelEl.classList.remove('open');
    openCalcPanelEl = null;
  }
}, { passive: true, capture: true });

document.getElementById('cart-panel-overlay').addEventListener('click', function(e) {
  if (handleCalcDelegatedClick(e)) return;
  const qtyBtn = e.target.closest('.cart-qty-btn');
  if (qtyBtn) {
    const key = qtyBtn.closest('.cart-item-row').getAttribute('data-key');
    const entry = cart.find(c => c.key === key);
    if (entry) {
      if (qtyBtn.getAttribute('data-op') === 'plus') entry.qty += 1;
      else entry.qty = Math.max(1, entry.qty - 1);
      renderCartPanel();
      renderCartBar();
      syncCartRowBadge(key);
    }
    return;
  }
  const removeBtn = e.target.closest('.cart-item-remove');
  if (removeBtn) {
    const key = removeBtn.closest('.cart-item-row').getAttribute('data-key');
    cart = cart.filter(c => c.key !== key);
    renderCartPanel();
    renderCartBar();
    syncCartRowBadge(key);
    return;
  }
  const clearBtn = e.target.closest('#cart-clear-btn');
  if (clearBtn) {
    cart = [];
    renderCartPanel();
    renderCartBar();
    syncAllCartBadges();
    return;
  }
  const cartShareBtn = e.target.closest('.cart-share-btn');
  if (cartShareBtn) {
    const panel = document.querySelector('.cart-calc-panel');
    const resultEl = panel ? panel.querySelector('.calc-result') : null;
    const totals = cartTotalsByCurrency();
    const priceText = resultEl ? resultEl.textContent.trim() : Object.keys(totals).map(cur => formatCalcAmount(totals[cur], cur)).join(' + ');
    const modelsText = cart.map(c => c.qty > 1 ? c.model + 'x' + c.qty : c.model).join('+');
    const shareText = modelsText + ' — ' + priceText;
    if (navigator.share) {
      navigator.share({ text: shareText }).catch(() => {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareText).then(() => {
        const oldHTML = cartShareBtn.innerHTML;
        cartShareBtn.innerHTML = '✓';
        setTimeout(() => { cartShareBtn.innerHTML = oldHTML; }, 1200);
      }).catch(() => {});
    }
    return;
  }
});

/* Дозволені формати зображень для акцій: за MIME-типом і, про всяк випадок, за розширенням
   (деякі Android-пікери не завжди коректно проставляють file.type). */
const PROMO_IMAGE_MIME_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
const PROMO_IMAGE_EXTENSIONS = ['png', 'jpg', 'jpeg', 'webp', 'gif'];

function isAllowedPromoImage(file) {
  if (file.type && PROMO_IMAGE_MIME_TYPES.includes(file.type)) return true;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  return PROMO_IMAGE_EXTENSIONS.includes(ext);
}

function guessImageContentType(file) {
  if (file.type && PROMO_IMAGE_MIME_TYPES.includes(file.type)) return file.type;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
  if (ext === 'webp') return 'image/webp';
  if (ext === 'gif') return 'image/gif';
  return 'image/png';
}

async function uploadPromoFile(file) {
  if (!isAllowedPromoImage(file)) {
    throw new Error('Непідтримуваний формат файлу. Дозволені: PNG, JPG, WEBP, GIF.');
  }
  const contentType = guessImageContentType(file);
  const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const { error: uploadError } = await sb.storage.from('promo-pdfs').upload(fileName, file, {
    contentType,
    upsert: false
  });
  if (uploadError) throw uploadError;
  const { data: publicUrlData } = sb.storage.from('promo-pdfs').getPublicUrl(fileName);
  return publicUrlData ? publicUrlData.publicUrl : null;
}

async function handlePromoUpload() {
  const titleInput = document.getElementById('promo-title-input');
  const imageInput = document.getElementById('promo-image-input');
  const statusEl = document.getElementById('promo-upload-status');
  const title = (titleInput.value || '').trim();
  const imageFile = imageInput.files && imageInput.files[0];

  if (!title) { statusEl.textContent = 'Введіть назву акції.'; return; }
  if (!imageFile) { statusEl.textContent = 'Виберіть зображення акції.'; return; }

  statusEl.textContent = 'Завантаження...';
  const btn = document.getElementById('promo-upload-btn');
  btn.disabled = true;

  try {
    const imageUrl = await uploadPromoFile(imageFile);

    const { data: maxRow } = await sb.from('promotions').select('sort_order').order('sort_order', { ascending: false }).limit(1).single();
    const nextSort = maxRow && typeof maxRow.sort_order === 'number' ? maxRow.sort_order + 1 : 1;

    const row = { title, is_active: true, sort_order: nextSort };
    if (imageUrl) row.image_url = imageUrl;

    const { error: insertError } = await sb.from('promotions').insert(row);
    if (insertError) throw insertError;

    statusEl.textContent = 'Готово! Акцію додано.';
    renderPromotionsTab();
  } catch (e) {
    statusEl.textContent = 'Помилка: ' + (e.message || 'не вдалося завантажити.');
    btn.disabled = false;
  }
}

/* ---------- Видалення акції (тільки super_admin) ---------- */
function extractPromoStoragePath(url) {
  if (!url) return null;
  const marker = '/storage/v1/object/public/promo-pdfs/';
  const idx = url.indexOf(marker);
  if (idx === -1) return null;
  try { return decodeURIComponent(url.slice(idx + marker.length)); } catch (e) { return url.slice(idx + marker.length); }
}

async function handleDeletePromo(id, imageUrl, pdfUrl) {
  if (!confirm('Видалити цю акцію назавжди? Цю дію не можна скасувати.')) return;
  try {
    const paths = [imageUrl, pdfUrl].map(extractPromoStoragePath).filter(Boolean);
    if (paths.length) {
      /* Не критично, якщо видалення файлу зі сховища не вдасться — головне прибрати запис з БД */
      await sb.storage.from('promo-pdfs').remove(paths).catch(function () {});
    }
    const { error } = await sb.from('promotions').delete().eq('id', id);
    if (error) throw error;
    renderPromotionsTab();
  } catch (e) {
    alert('Не вдалося видалити акцію: ' + (e.message || 'невідома помилка.'));
  }
}

   напівпрому код показується напряму на пульті, миготіння там не задіяне) і за самим
   кодом (шукає одразу серед ВСІХ типів обладнання — вибір типу заздалегідь не потрібен,
   тип показується в самому результаті). Джерело (таблиця "Джерела" у наданому файлі)
   навмисно НЕ виводиться окремим текстом у формі — назва помилки й рекомендовані дії в
   базі вже узяті з неї; сама назва джерела показується дрібним текстом унизу картки
   результату. */
let mhiResults = [];       // масив знайдених записів із mhi_error_codes (0, 1 або 2 — якщо
                            // код збігається і в побутових, і в напівпромі одночасно)
let mhiResultState = null; // null | 'notfound' | 'needinput'

const MHI_BLINK_OPTIONS = [
  'Не блимає', '1', '2', '3', '4', '5', '6', '7', 'Постійно блимає', 'Постійно світиться'
];

function renderMhiErrorsScreen() {

          <option value="">— оберіть —</option>${optHtml}
        </select>
      </div>

      <div class="mhi-field">
        <input type="text" class="mhi-code-input" id="mhi-code-input" placeholder="Наприклад: E39">
        <div class="mhi-hint">Введіть код так, як він показаний на пульті чи блоці — можна набрати лише цифри (наприклад «39»), літеру E додамо автоматично.</div>
      </div>
      <div class="mhi-btn-row">
        <button type="button" class="mhi-search-btn" id="mhi-code-search-btn">Знайти</button>
