function renderMhiResultsHtml() {
  if (mhiResultState === 'needinput') {
    return '<div class="mhi-result mhi-result-empty">Оберіть кількість миготінь для RUN і TIMER.</div>';
  }
  if (mhiResultState === 'notfound') {
    return '<div class="mhi-result mhi-result-empty">Код не знайдено. Перевірте правильність підрахунку миготінь або введений код і спробуйте ще раз.</div>';
  }
  if (!mhiResults || !mhiResults.length) return '';
  return mhiResults.map(renderOneMhiResultHtml).join('');
}

function renderOneMhiResultHtml(r) {
  const isSemi = r.equipment_type === 'semi';
  const equipLabel = isSemi ? 'Напівпром MHI' : 'Побутові та мультиспліт-системи MHI';
  // Тип обладнання заздалегідь не обирається (див. коментар вище), тому картка сама прямо
  // каже, до якого обладнання належить знайдена помилка — це головне уточнення користувача.
  const scopeNote = isSemi
    ? 'Ця помилка стосується лише напівпрому MHI.'
    : 'Ця помилка стосується лише побутових та мультиспліт систем MHI.';
  const checksHtml = String(r.actions || '')
    .split(';')
    .map(s => s.trim().replace(/\.+$/, ''))
    .filter(Boolean)
    .map(s => '<li>' + escapeHtml(s) + '.</li>')
    .join('');
  return `
    <div class="mhi-result">
      <div class="mhi-result-scope">${escapeHtml(scopeNote)}</div>
      <div class="mhi-result-code">${escapeHtml(r.code)}</div>
      <div class="mhi-result-name">${escapeHtml(r.name_uk)}</div>
      <div class="mhi-result-section-title">Рекомендовані дії</div>
      <ul class="mhi-result-checks">${checksHtml}</ul>
      <div class="mhi-result-section-title">Застосування</div>
      <div class="mhi-result-equip">${escapeHtml(equipLabel)}</div>
      ${r.source ? '<div class="mhi-result-source">Джерело: ' + escapeHtml(r.source) + '</div>' : ''}
    </div>`;
}

function attachMhiErrorsHandlers() {
  const blinkBtn = document.getElementById('mhi-blink-search-btn');
  if (blinkBtn) blinkBtn.addEventListener('click', searchMhiByBlink);
  const codeBtn = document.getElementById('mhi-code-search-btn');
  if (codeBtn) codeBtn.addEventListener('click', searchMhiByCode);
  const clearBtn = document.getElementById('mhi-clear-btn');
  if (clearBtn) clearBtn.addEventListener('click', clearMhiSearch);
  const codeInput = document.getElementById('mhi-code-input');
  if (codeInput) codeInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') searchMhiByCode(); });
}

function clearMhiSearch() {
  mhiResults = [];
  mhiResultState = null;
  renderMhiErrorsScreen();
}

async function searchMhiByBlink() {
  const runSelect = document.getElementById('mhi-run-select');
  const timerSelect = document.getElementById('mhi-timer-select');
  const runVal = runSelect ? runSelect.value : '';
  const timerVal = timerSelect ? timerSelect.value : '';
  const slot = document.getElementById('mhi-result-slot');
  if (!runVal || !timerVal) {
    mhiResults = [];
    mhiResultState = 'needinput';
    if (slot) slot.innerHTML = renderMhiResultsHtml();
    return;
  }
  if (slot) slot.innerHTML = '<div class="mhi-result-loading">Пошук…</div>';
  try {
    const { data, error } = await sb.from('mhi_error_codes').select('*')
      .eq('equipment_type', 'household')
      .eq('run_value', runVal)
      .eq('timer_value', timerVal)
      .limit(1);
    if (error) throw error;
    mhiResults = data || [];
    mhiResultState = mhiResults.length ? null : 'notfound';
  } catch (e) {
    if (slot) slot.innerHTML = '<div class="mhi-result mhi-result-empty">Помилка з’єднання. Спробуйте ще раз.</div>';
    return;
  }
  if (slot) slot.innerHTML = renderMhiResultsHtml();
}

function normalizeMhiCode(raw) {
  let s = String(raw || '').trim().toUpperCase();
  if (!s) return '';
  if (/^\d+$/.test(s)) s = 'E' + s;
  return s;
}

async function searchMhiByCode() {
  const input = document.getElementById('mhi-code-input');
  const code = normalizeMhiCode(input ? input.value : '');
  const slot = document.getElementById('mhi-result-slot');
  if (!code) {
    mhiResults = [];
    mhiResultState = null;
    if (slot) slot.innerHTML = '';
    return;
  }
  if (slot) slot.innerHTML = '<div class="mhi-result-loading">Пошук…</div>';
  try {
    // Тип обладнання заздалегідь не обирається — шукаємо код одразу серед усіх типів;
    // якщо один код є і в побутових, і в напівпромі (з різним значенням) — прийдуть обидва
    // записи, і кожен покаже своє "Ця помилка стосується лише ..." окремою карткою.
    const { data, error } = await sb.from('mhi_error_codes').select('*')
      .ilike('code', code);
    if (error) throw error;
    mhiResults = data || [];
    mhiResultState = mhiResults.length ? null : 'notfound';
  } catch (e) {
    if (slot) slot.innerHTML = '<div class="mhi-result mhi-result-empty">Помилка з’єднання. Спробуйте ще раз.</div>';
    return;
  }
  if (slot) slot.innerHTML = renderMhiResultsHtml();
}

/* ---------- Кабінет ---------- */
let cabinetMode = 'login'; // 'login' | 'register' — тільки для неавторизованого стану
let regionsCache = null;

function normalizePhoneDigits(phone) { return String(phone || '').replace(/\D/g, ''); }
function phoneToEmail(phone) { return 'p' + normalizePhoneDigits(phone) + '@sunice.local'; }

async function getRegions() {
  if (regionsCache) return regionsCache;
  const { data } = await sb.from('regions').select('*').order('sort_order');
  regionsCache = data || [];
  return regionsCache;
}

function statusLabel(status) {
  return {
    pending: 'На розгляді',
    approved: 'Підтверджено',
    rejected: 'Відхилено',
    blocked: 'Заблоковано'
  }[status] || 'На розгляді';
}
function priceTypeLabel(pt) {
  return { regular: 'Стандартна', client: 'Клієнтська', vip: 'VIP' }[pt] || (pt || '—');
}
function roleLabel(role) {
  return { user: 'Користувач', regional_admin: 'Регіональний адмін', super_admin: 'Супер-адмін' }[role] || role;
}

async function renderCabinetTab() {
  document.getElementById('title').textContent = 'Кабінет';
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Завантаження...</div>';

  const { data: sessionData } = await sb.auth.getSession();
  const session = sessionData ? sessionData.session : null;

  if (!session) {
    renderAuthForms();
    return;
  }

  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !profile) {
    main.innerHTML =
      '<div class="error">Не вдалося завантажити профіль. Спробуйте вийти і зайти знову.</div>' +
      '<button class="logout-btn" id="cab-logout-btn">Вийти</button>';

    return;
  }

/* ---- Неавторизований стан: вхід / реєстрація ---- */
function renderAuthForms() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="auth-toggle">
      <button type="button" id="auth-tab-login" class="${cabinetMode === 'login' ? 'active' : ''}">Вхід</button>
      <button type="button" id="auth-tab-register" class="${cabinetMode === 'register' ? 'active' : ''}">Реєстрація</button>
    </div>
    <div id="auth-form-holder"></div>
  `;
  document.getElementById('auth-tab-login').addEventListener('click', () => { cabinetMode = 'login'; renderAuthForms(); });
  document.getElementById('auth-tab-register').addEventListener('click', () => { cabinetMode = 'register'; renderAuthForms(); });
  if (cabinetMode === 'login') renderLoginForm(); else renderRegisterForm();
}

/* Прибирає з поля все, крім цифр, під час вводу (щоб залишався тільки номер після +38) */
function attachDigitsOnlyFilter(input) {
  input.addEventListener('input', () => {
    const cleaned = input.value.replace(/\D/g, '');
    if (cleaned !== input.value) input.value = cleaned;
  });
}
/* Складає повний номер у форматі +38XXXXXXXXXX з локальної частини, введеної користувачем */
function fullPhoneFromLocalInput(inputId) {
  const local = document.getElementById(inputId).value.trim();
  return '+38' + local;
}

function renderLoginForm() {
  const holder = document.getElementById('auth-form-holder');
  holder.innerHTML = `
    <div class="field">
      <label>Номер телефону</label>
      <div class="phone-input-row">
        <span class="phone-prefix">+38</span>
        <input type="tel" id="login-phone" placeholder="0501234567" maxlength="10" inputmode="numeric">
      </div>

    <div class="field">
      <label>Пароль</label>
      <input type="password" id="login-password" placeholder="Ваш пароль">
    </div>
    <button class="primary-btn" id="login-submit-btn">Увійти</button>
    <div id="login-error"></div>
  `;
  attachDigitsOnlyFilter(document.getElementById('login-phone'));
  document.getElementById('login-submit-btn').addEventListener('click', handleLogin);
  holder.querySelectorAll('input').forEach(inp => {

async function handleLogin() {
  const phone = fullPhoneFromLocalInput('login-phone');
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.innerHTML = '';
  if (normalizePhoneDigits(phone).length <= 2 || !password) {
    errEl.innerHTML = '<div class="error">Введіть телефон і пароль.</div>';
    return;
  }
  const btn = document.getElementById('login-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Вхід...';
  const { error } = await sb.auth.signInWithPassword({ email: phoneToEmail(phone), password: password });
  if (error) {
    errEl.innerHTML = '<div class="error">Невірний телефон або пароль.</div>';

    btn.textContent = 'Увійти';

  const holder = document.getElementById('auth-form-holder');
  holder.innerHTML = '<div class="empty">Завантаження...</div>';
  const regions = await getRegions();
  const options = regions.map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');

    <div class="field">
      <label>Ім’я та прізвище</label>

    </div>
    <div class="field">
      <label>Номер телефону</label>
      <div class="phone-input-row">
        <span class="phone-prefix">+38</span>
        <input type="tel" id="reg-phone" placeholder="0501234567" maxlength="10" inputmode="numeric">
      </div>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="reg-password" placeholder="Не менше 6 символів">
    </div>
    <div class="field">
      <label>Регіон</label>
      <select id="reg-region">${options}</select>
    </div>

    <div id="reg-error"></div>
  `;

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = fullPhoneFromLocalInput('reg-phone');
  const password = document.getElementById('reg-password').value;
  const regionSelect = document.getElementById('reg-region');
  const regionId = regionSelect.value;
  const errEl = document.getElementById('reg-error');
  errEl.innerHTML = '';

  if (!name || normalizePhoneDigits(phone).length <= 2 || !password || !regionId) {
    errEl.innerHTML = '<div class="error">Заповніть усі поля.</div>';
    return;
  }
  if (password.length < 6) {
    errEl.innerHTML = '<div class="error">Пароль має містити щонайменше 6 символів.</div>';
    return;
  }
  if (normalizePhoneDigits(phone).length < 11) {
    errEl.innerHTML = '<div class="error">Перевірте номер телефону.</div>';
    return;
  }

  const btn = document.getElementById('reg-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Реєстрація...';

  const { data: signUpData, error: signUpError } = await sb.auth.signUp({
    email: phoneToEmail(phone),
    password: password
  });

  if (signUpError) {
    const already = signUpError.message && /registered|exists/i.test(signUpError.message);
    errEl.innerHTML = '<div class="error">' + (already ? 'Цей номер телефону вже зареєстровано. Спробуйте увійти.' : 'Не вдалося зареєструватися. Спробуйте ще раз.') + '</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  const userId = signUpData && signUpData.user ? signUpData.user.id : null;
  if (!userId) {
    errEl.innerHTML = '<div class="error">Реєстрацію не завершено. Спробуйте увійти або зверніться до адміністратора.</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  const { error: profileError } = await sb.from('profiles').upsert({
    id: userId,
    full_name: name,
    phone: phone,
    region_id: parseInt(regionId, 10),
    status: 'pending',
    price_type: 'regular',
    role: 'user'
  }, { onConflict: 'id' });

  if (profileError) {
    errEl.innerHTML = '<div class="error">Акаунт створено, але не вдалося зберегти дані профілю. Зверніться до адміністратора.</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  renderCabinetTab();
}

/* ---- Push-сповіщення (для адміністраторів) ---- */
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const out = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
  return out;
}

async function getPushSubscriptionState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return { supported: false, enabled: false };
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return { supported: true, enabled: !!sub };
  } catch (e) {
    return { supported: true, enabled: false };
  }
}

async function enablePushNotifications(userId) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Цей браузер не підтримує push-сповіщення.');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('Дозвіл на сповіщення не надано. Увімкнути його можна в налаштуваннях браузера/застосунку.');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({
      user_id: userId,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' });
    if (error) { alert('Не вдалося зберегти підписку на сповіщення.'); return; }
    renderCabinetTab();
  } catch (e) {
    alert('Не вдалося увімкнути сповіщення на цьому пристрої.');
  }
}

/* Коли адмін відкрив Кабінет — вважаємо, що заявки переглянуті: гасимо бейдж і закриваємо сповіщення */

    navigator.serviceWorker.controller.postMessage('clear-notifications');
  }
  if ('clearAppBadge' in navigator) {
    try { navigator.clearAppBadge(); } catch (e) {}
  }
}

/* ---- Адмін-панель (regional_admin / super_admin) ---- */

    document.getElementById('cab-logout-btn').addEventListener('click', handleLogout);
    return;
  }

  const isSuper = profile.role === 'super_admin';

        <div class="user-card-actions">
          <button type="button" class="approve" data-action="approve" data-id="${u.id}">Підтвердити</button>
          <button type="button" class="reject" data-action="reject" data-id="${u.id}">Відхилити</button>
          ${deleteBtn}
        </div>`;
    } else {
      const blockLabel = u.status === 'blocked' ? 'Розблокувати' : 'Заблокувати';
      const blockAction = u.status === 'blocked' ? 'unblock' : 'block';
      actions = `
        <div class="user-card-row">
          <select data-action="price_type" data-id="${u.id}">
            <option value="regular" ${u.price_type === 'regular' ? 'selected' : ''}>Стандартна ціна</option>
            <option value="client" ${u.price_type === 'client' ? 'selected' : ''}>Клієнтська ціна</option>
            <option value="vip" ${u.price_type === 'vip' ? 'selected' : ''}>VIP ціна</option>
          </select>
          ${isSuper ? `<select data-action="role" data-id="${u.id}">
            <option value="user" ${u.role === 'user' ? 'selected' : ''}>Користувач</option>
            <option value="regional_admin" ${u.role === 'regional_admin' ? 'selected' : ''}>Регіон. адмін</option>
            <option value="super_admin" ${u.role === 'super_admin' ? 'selected' : ''}>Супер-адмін</option>
          </select>` : ''}
        </div>
        <div class="user-card-actions">
          <button type="button" data-action="${blockAction}" data-id="${u.id}">${blockLabel}</button>
          ${deleteBtn}
        </div>`;
    }
    return `
      <div class="user-card">
        <div class="user-card-top">
          <div>
            <p class="user-card-name">${escapeHtml(u.full_name || '(без імені)')}</p>
            <p class="user-card-sub">${escapeHtml(u.phone || '')} · ${escapeHtml(regionName(u.region_id))}${!isPending ? ' · ' + escapeHtml(roleLabel(u.role)) : ''}</p>
          </div>
          <span class="badge ${badgeClass}">${escapeHtml(statusLabel(u.status))}</span>
        </div>
        ${actions}
      </div>`;
  }

  const pending = adminUsersCache.filter(u => u.status === 'pending');
  const others = adminUsersCache.filter(u => u.status !== 'pending');
  const pushState = await getPushSubscriptionState();

  let html = '';
  if (pushState.supported) {
    html += pushState.enabled
      ? '<div class="push-status">🔔 Сповіщення на цьому пристрої увімкнено</div>'
      : '<button type="button" class="link-btn push-enable-btn" id="enable-push-btn">🔔 Увімкнути сповіщення на цьому пристрої</button>';
  }
  html += `<div class="admin-section-title">Заявки на розгляді (${pending.length})</div>`;
  html += pending.length ? pending.map(u => userCardHtml(u, true)).join('') : '<div class="empty" style="padding:16px;">Нових заявок немає</div>';
  html += `<div class="admin-section-title">Користувачі (${others.length})</div>`;
  html += '<div class="admin-search"><input type="text" id="admin-search" placeholder="Пошук за іменем або телефоном"></div>';
  html += '<div id="admin-users-list">' + (others.length ? others.map(u => userCardHtml(u, false)).join('') : '<div class="empty" style="padding:16px;">Користувачів немає</div>') + '</div>';
  html += '<button class="logout-btn" id="cab-logout-btn">Вийти</button>';

  main.innerHTML = html;
  clearNotificationsAndBadge();

  document.getElementById('cab-logout-btn').addEventListener('click', handleLogout);
  document.getElementById('admin-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = others.filter(u => !q || (u.full_name || '').toLowerCase().includes(q) || (u.phone || '').toLowerCase().includes(q));
    document.getElementById('admin-users-list').innerHTML = filtered.length
      ? filtered.map(u => userCardHtml(u, false)).join('')
      : '<div class="empty" style="padding:16px;">Нічого не знайдено</div>';
  });
  const enablePushBtn = document.getElementById('enable-push-btn');
  if (enablePushBtn) enablePushBtn.addEventListener('click', () => enablePushNotifications(profile.id));
}

async function handleAdminAction(action, id, value) {
  if (action === 'delete') {
    if (!confirm('Видалити цього користувача назавжди? Він зможе зареєструватися заново з тим самим номером. Цю дію не можна скасувати.')) return;
    const { data, error } = await sb.functions.invoke('admin-delete-user', { body: { user_id: id } });
    if (error || (data && data.error)) {
      const detail = (data && data.error) || (error && error.message) || 'невідома помилка';
      alert('Не вдалося видалити користувача: ' + detail);
      return;
    }
    renderCabinetTab();
    return;
  }

  let update = null;
  if (action === 'approve') update = { status: 'approved' };
  else if (action === 'reject') update = { status: 'rejected' };
  else if (action === 'block') update = { status: 'blocked' };
  else if (action === 'unblock') update = { status: 'approved' };
  else if (action === 'price_type') update = { price_type: value };
  else if (action === 'role') update = { role: value };
  else return;

  const { error } = await sb.from('profiles').update(update).eq('id', id);
  if (error) {
    alert('Не вдалося зберегти зміни. Спробуйте ще раз.');
    return;
  }
  renderCabinetTab();
}

/* ---------- Перемикання вкладок нижнього меню ---------- */
function switchTab(tab, pushHistory) {
  currentTab = tab;
  activeTile = null;
  infoSection = null;
  infoBrand = null;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
  });
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('rate-row').style.display = 'none';
  openCalcPanelEl = null;
  closeCartPanel();
  renderCartBar();
  document.getElementById('refresh-icon').style.display = tab === 'catalog' ? 'flex' : 'none';
  document.getElementById('shortcut-icon').style.display = tab === 'cabinet' ? 'flex' : 'none';
  document.getElementById('status-row').style.display = 'none';
  document.getElementById('error-block').innerHTML = '';
  if (pushHistory) {
    history.pushState({ tab: tab }, '', '#' + tab);
  }
}

function renderCurrentTab() {
  if (currentTab === 'catalog') {
    if (!catalogInitDone) { catalogInitDone = true; initCatalog(); }
    else renderCatalogView();
  } else if (currentTab === 'promotions') renderPromotionsTab();
  else if (currentTab === 'cabinet') renderCabinetTab();
  else if (currentTab === 'contacts') renderContactsTab();
  else if (currentTab === 'info') renderInfoTab();
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.getAttribute('data-tab');
    if (tab === currentTab && activeTile === null) return;
    switchTab(tab, true);
    renderCurrentTab();
  });
});

/* ---------- Встановлення на головний екран ---------- */
let deferredInstallPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const bannerDismissed = localStorage.getItem('sunice_install_dismissed') === '1';

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  /* Автоматичний банер відключено — замість нього при першому відкритті показується
     повноекранна пропозиція встановлення (install-gate, див. нижче). */
});

function showInstallBanner(platform) {
  const banner = document.getElementById('install-banner');
  const textEl = document.getElementById('install-banner-text');
  const actionBtn = document.getElementById('install-action-btn');
  if (platform === 'android') {
    textEl.textContent = 'Встановіть застосунок Sun-ice на головний екран';
    actionBtn.style.display = 'inline-block';
    actionBtn.onclick = async () => {
      banner.classList.remove('show');
      await triggerAddToHomeScreen();
    };
  } else {
    textEl.textContent = 'Щоб встановити застосунок: натисніть «Поділитися» ⬆ внизу екрана → «На екран Домой»';
    actionBtn.style.display = 'none';
  }
  banner.classList.add('show');
}

/* Кнопка "Ярлик" у вкладці Контакти — той самий системний діалог встановлення,
   викликаний вручну (корисно, якщо автоматичний банер з якоїсь причини не показався). */
async function triggerAddToHomeScreen() {
  if (isStandalone) {
    alert('Застосунок уже встановлено на цьому пристрої.');
    return;
  }
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('shortcut-icon').style.opacity = '0.5';
    return;
  }
  if (isIOS) {
    alert('Щоб встановити застосунок на iPhone/iPad: натисніть кнопку «Поділитися» ⬆ внизу екрана Safari → «На екран Домой».');
    return;
  }
  alert('Браузер поки не пропонує швидке встановлення (можливо, застосунок вже додавався раніше, або сторінку щойно відкрито). Спробуйте: меню браузера (⋮) → «Додати на головний екран» / «Встановити застосунок».');
}
document.getElementById('shortcut-icon').addEventListener('click', triggerAddToHomeScreen);

document.getElementById('install-close-btn').addEventListener('click', () => {
  document.getElementById('install-banner').classList.remove('show');
  localStorage.setItem('sunice_install_dismissed', '1');
});

/* ---------- Пропозиція встановити застосунок при першому відкритті ---------- */
const INSTALL_GATE_SKIP_KEY = 'sunice_continue_in_browser';

function installGateIconHtml() {
  const iconLink = document.querySelector('link[rel="icon"]');
  const src = iconLink ? iconLink.getAttribute('href') : '';
  return '<div class="install-gate-appicon"><img src="' + src + '" alt=""></div>';
}

function installGateHeaderHtml() {
  return (
    '<div class="install-gate-row">' +
    installGateIconHtml() +
    '<div class="install-gate-appinfo">' +
    '<div class="install-gate-appname">Sun-ice</div>' +
    '<div class="install-gate-appsub">sun-ice.com.ua • Застосунок</div>' +
    '</div></div>'
  );
}

function setInstallGateSheet(html) {
  document.getElementById('install-gate-sheet').innerHTML = html;
}

function closeInstallGate() {
  document.getElementById('install-gate').classList.remove('show');
}

function detectInAppBrowserName() {
  const ua = navigator.userAgent || '';
  if (/FBAN|FBAV/i.test(ua)) return 'Facebook';
  if (/Instagram/i.test(ua)) return 'Instagram';
  if (/Telegram/i.test(ua)) return 'Telegram';
  if (/Viber/i.test(ua)) return 'Viber';
  if (/MicroMessenger/i.test(ua)) return 'WeChat';
  return null;
}

function renderInstallGateConfirmSkip() {
  setInstallGateSheet(
    '<p class="install-gate-desc"><strong>Якщо продовжити в браузері:</strong></p>' +
    '<ul class="install-gate-list">' +
    '<li>не приходитимуть push-сповіщення про нові акції та статус заявки;</li>' +
    '<li>доведеться щоразу заново відкривати сайт через браузер, а не одним дотиком з головного екрана.</li>' +
    '</ul>' +
    '<p class="install-gate-desc">Каталог, акції, кабінет і контакти працюватимуть так само — це лише менш зручний спосіб.</p>' +
    '<button type="button" class="install-gate-install-btn" id="install-gate-back-to-install-btn">Все ж встановити</button>' +
    '<button type="button" class="install-gate-skip-btn" id="install-gate-skip-btn">Продовжити в браузері</button>'
  );
  document.getElementById('install-gate-back-to-install-btn').addEventListener('click', renderInstallGateMain);
  document.getElementById('install-gate-skip-btn').addEventListener('click', () => {
    localStorage.setItem(INSTALL_GATE_SKIP_KEY, '1');
    closeInstallGate();
  });
}

function renderInstallGateInstalled() {
  setInstallGateSheet(
    '<p class="install-gate-desc">Готово! Застосунок встановлено. Закрийте цю вкладку браузера і відкрийте Sun-ice з ярлика на головному екрані.</p>'
  );
}

function renderInstallGateManualFallback() {
  setInstallGateSheet(
    installGateHeaderHtml() +
    '<p class="install-gate-desc">Браузер поки не готовий запропонувати швидке встановлення. Відкрийте меню браузера (⋮) і оберіть «Додати на головний екран» / «Встановити застосунок».</p>' +
    '<button type="button" class="install-gate-later-btn" id="install-gate-later-btn">Не зараз</button>'
  );
  document.getElementById('install-gate-later-btn').addEventListener('click', renderInstallGateConfirmSkip);
}

function renderInstallGateIOS() {
  setInstallGateSheet(
    installGateHeaderHtml() +
    '<p class="install-gate-desc">Щоб встановити застосунок на iPhone/iPad: натисніть кнопку «Поділитися» ⬆ внизу екрана Safari, потім оберіть «На екран Домой».</p>' +
    '<button type="button" class="install-gate-later-btn" id="install-gate-later-btn">Не зараз</button>'
  );
  document.getElementById('install-gate-later-btn').addEventListener('click', renderInstallGateConfirmSkip);
}

function renderInstallGateInApp(name) {
  setInstallGateSheet(
    installGateHeaderHtml() +
    '<p class="install-gate-desc">Це посилання відкрито у вбудованому браузері ' + escapeHtml(name) + ' — з нього застосунок не встановлюється. Натисніть «⋮» (або «...») у верхньому куті екрана і оберіть «Відкрити в браузері» (Chrome/Safari), а вже там встановіть застосунок.</p>' +
    '<button type="button" class="install-gate-later-btn" id="install-gate-later-btn">Не зараз</button>'
  );
  document.getElementById('install-gate-later-btn').addEventListener('click', renderInstallGateConfirmSkip);
}

function renderInstallGateMain() {
  const inApp = detectInAppBrowserName();
  if (inApp) { renderInstallGateInApp(inApp); return; }
  if (isIOS) { renderInstallGateIOS(); return; }

  setInstallGateSheet(
    installGateHeaderHtml() +
    '<p class="install-gate-desc">Встановіть застосунок на головний екран телефону — швидкий запуск без браузера та push-сповіщення про нові акції і статус заявки.</p>' +
    '<button type="button" class="install-gate-install-btn" id="install-gate-install-btn">Встановити</button>' +
    '<button type="button" class="install-gate-later-btn" id="install-gate-later-btn">Не зараз</button>'
  );
  document.getElementById('install-gate-install-btn').addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if (choice && choice.outcome === 'accepted') renderInstallGateInstalled();
    } else {
      renderInstallGateManualFallback();
    }
  });
  document.getElementById('install-gate-later-btn').addEventListener('click', renderInstallGateConfirmSkip);
}

function showInstallGate() {
  if (isStandalone) return;
  if (localStorage.getItem(INSTALL_GATE_SKIP_KEY) === '1') return;
  renderInstallGateMain();
  document.getElementById('install-gate').classList.add('show');
}

window.addEventListener('appinstalled', () => {
  if (document.getElementById('install-gate').classList.contains('show')) {
    renderInstallGateInstalled();
  }
});

/* ---------- Перегляд зображення на весь екран: наближення/віддалення, панорамування ---------- */
(function () {
  const overlay = document.getElementById('img-lightbox-overlay');
  const stage = document.getElementById('img-lightbox-stage');
  const imgEl = document.getElementById('img-lightbox-img');
  const zoomInBtn = document.getElementById('img-lightbox-zoomin');
  const zoomOutBtn = document.getElementById('img-lightbox-zoomout');
  const resetBtn = document.getElementById('img-lightbox-reset');
  const closeBtn = document.getElementById('img-lightbox-close');

  const MIN_SCALE = 1;
  const MAX_SCALE = 6;
  let scale = 1, tx = 0, ty = 0;
  const pointers = new Map();
  let pinchStartDist = null;
  let dragStart = null;
  let lastTapTime = 0;

  function applyTransform() {
    imgEl.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
  }

  function clampScale(s) { return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s)); }

  function resetView() { scale = 1; tx = 0; ty = 0; applyTransform(); }

  window.openImageLightbox = function (url) {
    if (!url) return;
    imgEl.src = url;
    resetView();
    overlay.classList.add('active');
  };

  function closeLightbox() {
    overlay.classList.remove('active');
    imgEl.src = '';
    pointers.clear();
    pinchStartDist = null;
    dragStart = null;
  }

  closeBtn.addEventListener('click', closeLightbox);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay || e.target === stage) closeLightbox();
  });
  zoomInBtn.addEventListener('click', function () { scale = clampScale(scale + 0.5); applyTransform(); });
  zoomOutBtn.addEventListener('click', function () { scale = clampScale(scale - 0.5); applyTransform(); });
  resetBtn.addEventListener('click', resetView);

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  imgEl.addEventListener('pointerdown', function (e) {
    imgEl.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragStart = { x: e.clientX - tx, y: e.clientY - ty };
    } else if (pointers.size === 2) {
      dragStart = null;
      const pts = Array.from(pointers.values());
      pinchStartDist = dist(pts[0], pts[1]);
    }
  });

  imgEl.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      const d = dist(pts[0], pts[1]);
      const m = mid(pts[0], pts[1]);
      if (pinchStartDist) {
        const newScale = clampScale(scale * (d / pinchStartDist));
        tx = m.x - (m.x - tx) * (newScale / scale);
        ty = m.y - (m.y - ty) * (newScale / scale);
        scale = newScale;
        applyTransform();
      }
      pinchStartDist = d;
    } else if (dragStart && pointers.size === 1 && scale > MIN_SCALE) {
      tx = e.clientX - dragStart.x;
      ty = e.clientY - dragStart.y;
      applyTransform();
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStartDist = null;
    if (pointers.size === 0) {
      dragStart = null;
      const now = Date.now();
      if (now - lastTapTime < 300) {
        if (scale > MIN_SCALE) resetView();
        else { scale = 2.5; applyTransform(); }
      }
      lastTapTime = now;
    }
  }
  imgEl.addEventListener('pointerup', endPointer);
  imgEl.addEventListener('pointercancel', endPointer);
  imgEl.addEventListener('pointerleave', endPointer);

  imgEl.addEventListener('wheel', function (e) {
    e.preventDefault();
    const newScale = clampScale(scale + (e.deltaY < 0 ? 0.3 : -0.3));
    tx = e.clientX - (e.clientX - tx) * (newScale / scale);
    ty = e.clientY - (e.clientY - ty) * (newScale / scale);
    scale = newScale;
    applyTransform();
  }, { passive: false });
})();

if ('serviceWorker' in navigator) {

history.replaceState({ tab: 'catalog' }, '', '#catalog');
