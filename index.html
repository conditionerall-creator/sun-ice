<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Sun-ice</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sun-ice">
<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #F8FAFC;
    --card: #ffffff;
    --border: #E2E8F0;
    --text: #0F172A;
    --text-secondary: #64748B;
    --accent: #E60012;
    --accent-bg: #FEE2E2;
    --danger: #a32d2d;
    --navy: #0F172A;
    --navy-2: #1E293B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #fff; }

  /* Install banner */
  .install-banner {
    display: none;
    background: linear-gradient(to right, #111827, var(--navy-2), var(--navy));
    color: #fff;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    font-size: 13px;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #1e293b;
  }
  .install-banner.show { display: flex; }
  .install-banner-text { flex: 1; line-height: 1.4; display: flex; align-items: center; gap: 8px; }
  .install-banner-text::before {
    content: '';
    width: 5px; height: 22px;
    background: var(--accent);
    border-radius: 3px;
    flex-shrink: 0;
  }
  .install-banner button {
    background: #fff;
    color: var(--navy);
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .install-banner .close-x {
    background: transparent;
    color: #94a3b8;
    font-size: 16px;
    padding: 4px 6px;
    font-weight: 400;
  }

  /* Header */
  header {
    padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .install-banner.show ~ .app header { padding-top: 16px; }

  /* Пропозиція встановити застосунок — вигляд, близький до нативного системного діалогу */
  .install-gate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 3000;
    align-items: flex-end;
    justify-content: center;
  }
  .install-gate.show { display: flex; }
  .install-gate-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
  }
  .install-gate-sheet {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 34px rgba(0,0,0,0.28);
    animation: install-gate-slide-up 0.22s ease-out;
  }
  @keyframes install-gate-slide-up {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .install-gate-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .install-gate-appicon img { width: 52px; height: 52px; border-radius: 14px; display: block; box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
  .install-gate-appinfo { flex: 1; min-width: 0; }
  .install-gate-appname { font-size: 16px; font-weight: 700; color: var(--text); }
  .install-gate-appsub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .install-gate-desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.55; margin: 0 0 16px; }
  .install-gate-list { margin: 0 0 14px; padding-left: 18px; font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; }
  .install-gate-install-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 8px;
  }
  .install-gate-later-btn, .install-gate-skip-btn, .install-gate-back-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 8px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    opacity: 0.75;
  }
  .install-gate-later-btn:active, .install-gate-skip-btn:active, .install-gate-back-btn:active { opacity: 1; }
  .header-top { display: flex; align-items: center; gap: 10px; }
  .back-btn {
    display: none;
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--text);
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin: 0; flex: 1; display: flex; align-items: center; gap: 9px; }
  h1::before {
    content: '';
    width: 9px; height: 9px;
    background: var(--accent);
    border-radius: 2px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .status-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .status-text { font-size: 12px; color: var(--text-secondary); flex: 1; }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn-text {
    width: auto;
    height: 34px;
    padding: 0 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    border-color: var(--accent);
    white-space: nowrap;
  }
  input[type=file] { display: none; }

  .search-row { margin-top: 10px; display: flex; gap: 8px; }
  input[type=text] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  select {
    padding: 10px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }

  main { flex: 1; padding: 8px 12px 90px; background: var(--bg); }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.6;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px -1px rgba(15,23,42,0.06);
    display: flex;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  .nav-btn {
    position: relative;
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 2px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn .nav-icon { font-size: 19px; line-height: 1; }
  .nav-btn.active { color: var(--accent); font-weight: 700; }
  .nav-btn.active::before {
    content: '';
    position: absolute;
    top: 0;
    width: 30px;
    height: 3px;
    border-radius: 0 0 4px 4px;
    background: var(--accent);
  }

  /* Home menu (catalog categories) */
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-top: 8px;
  }
  .menu-tile {
    background: var(--card);
    border: 1px solid #CBD5E1;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 92px;
    justify-content: space-between;
    box-shadow: 0 2px 8px -2px rgba(15,23,42,0.05), 0 1px 4px -1px rgba(15,23,42,0.03);
    transition: box-shadow .15s, transform .1s, border-color .15s;
  }
  .menu-tile:active { transform: scale(0.985); border-color: #CBD5E1; box-shadow: none; }
  .menu-tile-row { display: flex; align-items: center; justify-content: space-between; }
  .menu-tile-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; color: var(--text); }
  .menu-tile-empty { cursor: default; border-color: rgba(203,213,225,0.7); }
  .menu-tile-empty:active { transform: none; }
  .menu-tile-empty .menu-tile-title { color: var(--text-secondary); font-weight: 600; }
  .menu-tile-soon {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #64748b;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    padding: 2px 8px;
  }
  /* Перемикач бренду MHI / GAL у прайсі */
  .brand-toggle {
    display: flex;
    gap: 6px;
    padding: 4px 0 12px;
  }
  .brand-toggle-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .brand-toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .menu-tile-icon {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 4px 10px;
    border-radius: 6px;
    background: #d8f5ea;
    color: #00875a;
    border: 1px solid #99e6cb;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .03em;
  }
  .menu-tile-empty .menu-tile-icon {
    background: #edf2f7;
    color: #475569;
    border: 1px solid #cbd5e1;
  }

  /* List rows */
  .row {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  /* Клікабельна зона для пошуку в Google — тільки ліва чверть рядка (не весь рядок і не весь напис) */
  .row-click-zone {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 25%;
    min-width: 60px;
    cursor: pointer;
    z-index: 1;
  }
  .segment-header {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 14px 6px 6px;
    border-bottom: 3px solid var(--border);
    margin-bottom: 8px;
  }
  .row-info { min-width: 0; flex: 1; }
  .row-name { font-size: 14px; font-weight: 500; margin: 0; word-break: break-word; position: relative; z-index: 0; }
  .row-click-zone:active ~ .row-info .row-name { opacity: 0.6; }
  .row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 1px; }
  .row-price { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .calc-toggle {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .calc-toggle:active { background: var(--accent-bg); }
  .calc-panel {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 13px;
    color: var(--text-secondary);
  }
  .calc-panel.open { display: flex; }
  .calc-panel input.calc-input {
    width: 46px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
    background: var(--card);
    color: var(--text);
  }
  .calc-result { font-weight: 700; color: var(--accent); }
  .count { font-size: 12px; color: var(--text-secondary); padding: 8px 2px 4px; }

  .error {
    background: #fcebeb;
    color: var(--danger);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 10px;
  }
  .warn {
    background: #faeeda;
    color: #854f0b;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12px;
    margin-top: 10px;
    line-height: 1.5;
  }

  /* Branches / contacts */
  .branch-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
  }
  .branch-name { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .branch-line { font-size: 13px; color: var(--text-secondary); margin: 4px 0; line-height: 1.4; }
  .branch-line a { color: var(--accent); text-decoration: none; font-weight: 500; }

  /* Promotions */
  .promo-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .promo-image { width: 100%; display: block; height: auto; max-height: 80vh; object-fit: contain; background: var(--bg); }
  .promo-body { padding: 14px 16px; }
  .promo-title { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .promo-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 6px; }
  .promo-meta { font-size: 12px; color: var(--accent); font-weight: 500; }
  .promo-pdf-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .promo-upload-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .promo-upload-title { font-size: 14px; font-weight: 600; margin: 0; }
  .promo-upload-label { font-size: 12px; color: var(--text-secondary); margin: 2px 0 -4px; }
  .promo-upload-card input[type="text"],
  .promo-upload-card input[type="file"] {
    display: block;
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    color: var(--text);
    font-family: inherit;
    box-sizing: border-box;
  }
  .promo-upload-btn {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .promo-upload-btn:disabled { opacity: 0.6; cursor: default; }
  .promo-upload-status { font-size: 12px; color: var(--text-secondary); margin: 0; min-height: 14px; }
  .promo-image { cursor: zoom-in; }
  .promo-delete-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #f0cccc;
    background: var(--bg);
    color: var(--danger);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .promo-doc-note { font-size: 12px; color: var(--text-secondary); margin: -4px 0 0; }

  /* Інфо → Каталоги: картка з посиланням на PDF-каталог виробника */
  .info-doc-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .info-doc-link {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    text-decoration: none;
  }
  .info-doc-link:active { color: var(--accent); }
  .info-doc-btn {
    display: block;
    text-align: center;
    padding: 11px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }

  /* Перегляд зображення акції на весь екран (наближення/панорамування) */
  .img-lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.94);
    z-index: 1000;
    flex-direction: column;
  }
  .img-lightbox-overlay.active { display: flex; }
  .img-lightbox-topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .img-lightbox-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
  }
  .img-lightbox-btn:active { background: rgba(255,255,255,0.28); }
  .img-lightbox-stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-lightbox-stage img {
    max-width: 92%;
    max-height: 92%;
    transform-origin: center center;
    will-change: transform;
    cursor: grab;
    -webkit-user-drag: none;
    user-select: none;
  }

  /* Cabinet */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  .primary-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.6; }
  .status-card {
    background: var(--accent-bg);
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
  }
  .status-card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .status-card-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    margin-top: 14px;
  }

  /* Auth (login/register) */
  .auth-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    background: var(--bg);
    border-radius: 10px;
    padding: 4px;
  }
  .auth-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 9px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
  }
  .auth-toggle button.active {
    background: var(--card);
    color: var(--accent);
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .logout-btn {
    width: 100%;
    padding: 11px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--danger);
    cursor: pointer;
    margin-top: 18px;
    font-family: inherit;
  }
  .joke-banner {
    background: var(--accent-bg);
    color: var(--accent);

<script>
/* ==================== НАЛАШТУВАННЯ ==================== */
const SUPABASE_URL = 'https://pwyeifgjfyymhhvzigcg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CFO8bbjiwrqfnTiuPf2SJg_r9Zt-cke';
const PRICE_FILE_URL = SUPABASE_URL + '/storage/v1/object/public/price/price.xlsx';

/* Плитки головного екрану каталогу, у потрібному порядку.
   Плитка з "mhi"/"gal" — активна (є перемикач брендів MHI/GAL).
   Плитка без них — поки не наповнена, показується сірою "Скоро". */
const CATALOG_TILES = [
  {
    id: 'split', label: 'Спліт-системи',
    mhi: { key: 'split_mhi', sheet: 'ПОБУТОВІ', highlight: 'series' },
    gal: { key: 'split_gal', sheet: 'GALACTIC', highlight: 'series', splitMarker: 'мульти-спліт систем', splitSide: 'before' }
  },
  {
    id: 'multisplit', label: 'Мульти спліт-системи',
    mhi: { key: 'multisplit_mhi', sheet: 'МУЛЬТИСИСТЕМИ', highlight: 'series' },
    gal: { key: 'multisplit_gal', sheet: 'GALACTIC', highlight: 'series', splitMarker: 'мульти-спліт систем', splitSide: 'after' }
  },
  {
    id: 'semi', label: 'Напівпромислові спліт-системи',
    mhi: { key: 'semi_mhi', sheet: 'НАПІВПРОМ', highlight: 'category', baseAdjustPct: 20 },
    gal: { key: 'semi_gal', sheet: 'Galactic LCAC', highlight: 'category' }
  },
  { id: 'vrf', label: 'Мультизональні VRF' },
  { id: 'ccb', label: 'Компресорно-конденсаторні блоки' },
  { id: 'heatpumps', label: 'Теплові насоси' },
  { id: 'chillers', label: 'Чиллери' },
  { id: 'ventilation', label: 'Вентиляційне обладнання' },
  { id: 'aircurtains', label: 'Повітряні завіси' },
  { id: 'convectors', label: 'Конвектори та обігрівачі' }
];

/* ЖАРТ-НАПИСИ (тимчасово) — щоб прибрати жарти, просто постав false */
const JOKE_MODE = true;

/* Push-сповіщення адміністраторам про нову заявку + лічильник на іконці застосунку.
   Публічний VAPID-ключ — безпечно тримати в клієнтському коді (це не секрет). */
const VAPID_PUBLIC_KEY = 'BIoU6N899jbSOeI02wfVBgX5M4VUq6oM-Vz_TeDiUYxIdjgbW9w2Jeza2ao54kirnajo6eSDzo6QA_-wnmBYKiM';
/* ======================================================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTab = 'catalog';
let sheetsData = {};
let activeTile = null; // null = меню категорій каталогу
let activeBrand = 'mhi'; // 'mhi' | 'gal' — активний бренд у плитці з перемикачем
let priceVersion = null;
let catalogInitDone = false;

/* Навігація вкладки "Інфо": null = верхнє меню (Каталоги / Технічна інфа) */
let infoSection = null; // 'catalogs' | 'techinfo' | null
let infoBrand = null;   // 'mhi' | 'galactic' | null

/* ---------- Допоміжні функції парсингу прайсу ---------- */
const priceKeywordGroups = [
  ['ціна дилер', 'цена дилер', 'dealer price'],
  ['роздрібна ціна', 'розничная цена', 'retail price'],
  ['ціна', 'цена', 'price', 'стоимость']
];
const modelKeywords = ['модель', 'маркировка', 'маркування', 'артикул', 'sku', 'model', 'найменування', 'наименование'];
const internalKeywords = ['внутрішній', 'внутренний', 'indoor'];
const externalKeywords = ['зовнішній', 'наружный', 'outdoor'];
const totalSubKeywords = ['комплект', 'всього', 'разом', 'итого', 'total'];
const categoryStems = ['настінн', 'стельов', 'касетн', 'канальн', 'колонн', 'підлогов', 'підвісн', 'шафов'];
const PALETTE = ['#dbeafe', '#dcfce7', '#fef9c3', '#fce7f3', '#ede9fe', '#ffedd5', '#ccfbf1', '#fee2e2'];

function norm(v) { return String(v == null ? '' : v).toLowerCase().trim(); }
function cellContainsAny(v, keywords) {
  const s = norm(v);
  if (!s) return false;
  return keywords.some(k => s.includes(k));
}
function parseNumber(val) {
  if (typeof val === 'number') return isFinite(val) ? val : null;
  if (!val) return null;
  const s = String(val).trim();
  if (!s) return null;
  const cleaned = s.replace(/\s/g, '').replace(/[^\d.,-]/g, '').replace(',', '.');
  const num = parseFloat(cleaned);
  return isNaN(num) ? null : num;
}
function detectCurrency(headerText) {
  const s = norm(headerText);
  if (s.includes('грн')) return 'грн';
  if (s.includes('у.е') || s.includes('$')) return '$';
  if (s.includes('₴')) return '₴';
  return '';
}
function findPriceHeader(rows) {
  for (const group of priceKeywordGroups) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r] || [];
      for (let c = 0; c < row.length; c++) {
        if (cellContainsAny(row[c], group)) return { row: r, col: c, text: row[c] };
      }
    }
  }
  return null;
}
function findColumnInRow(row, keywords) {
  if (!row) return -1;
  for (let c = 0; c < row.length; c++) {
    if (cellContainsAny(row[c], keywords)) return c;
  }
  return -1;
}
function extractSeries(model) {
  if (!model) return null;
  const first = model.split(/[\s+]/)[0];
  const m = first.match(/^[A-ZА-ЯІЇЄ]+-?(\d+)([A-ZА-ЯІЇЄ]+)/i);
  return m ? m[2].toUpperCase() : null;
}
function isCategoryLabel(text) {
  const s = norm(text);
  if (!s) return false;
  return categoryStems.some(stem => s.includes(stem));
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function parseSheet(rows, highlightMode) {
  const priceHeader = findPriceHeader(rows);
  if (!priceHeader) return { items: [], error: 'Не знайдено колонку з ціною' };

  let priceCol = priceHeader.col;
  let dataStart = priceHeader.row + 1;
  const nextRow = rows[priceHeader.row + 1];
  if (nextRow) {
    for (let c = priceCol; c < nextRow.length; c++) {
      if (cellContainsAny(nextRow[c], totalSubKeywords)) {
        priceCol = c;
        dataStart = priceHeader.row + 2;
        break;
      }
    }
  }

  const headerRow = rows[priceHeader.row] || [];
  const headerRowAbove = rows[priceHeader.row - 1] || [];
  let modelCol = findColumnInRow(headerRow, modelKeywords);
  if (modelCol === -1) modelCol = findColumnInRow(headerRowAbove, modelKeywords);

  const internalCol = findColumnInRow(headerRow, internalKeywords);
  const externalCol = findColumnInRow(headerRow, externalKeywords);
  const currency = detectCurrency(priceHeader.text);
  const items = [];
  let currentCategory = null;

  for (let r = dataStart; r < rows.length; r++) {
    const row = rows[r] || [];
    const price = parseNumber(row[priceCol]);

    if (price === null && highlightMode === 'category' && modelCol !== -1) {
      const labelText = String(row[modelCol] || '').trim();
      const hasInternal = internalCol !== -1 && row[internalCol];
      const hasExternal = externalCol !== -1 && row[externalCol];
      if (labelText && !hasInternal && !hasExternal && isCategoryLabel(labelText)) {
        currentCategory = labelText;
      }
    }

    if (price === null) continue;

    let model = modelCol !== -1 ? String(row[modelCol] || '').trim() : '';
    if (!model && internalCol !== -1) {
      const parts = [row[internalCol], row[externalCol]].filter(v => v && String(v).trim());
      model = parts.map(v => String(v).trim()).join(' + ');
    }
    if (!model) continue;

    const item = { model, price, currency };
    if (highlightMode === 'series') item.groupKey = extractSeries(model);
    else if (highlightMode === 'category') item.groupKey = currentCategory;
    items.push(item);
  }

  if (highlightMode) {
    const colorMap = new Map();
    items.forEach(it => {
      if (!it.groupKey) return;
      if (!colorMap.has(it.groupKey)) colorMap.set(it.groupKey, PALETTE[colorMap.size % PALETTE.length]);
      it.color = colorMap.get(it.groupKey);
    });
  }

  return { items, error: items.length === 0 ? 'Не знайдено рядків з маркуванням і ціною' : null };
}

function sliceBySplitMarker(rows, marker, side) {
  const idx = rows.findIndex(row => (row || []).some(cell => norm(cell).includes(marker)));
  if (idx === -1) return rows; // маркер не знайдено — повертаємо все як є
  return side === 'after' ? rows.slice(idx) : rows.slice(0, idx);
}

function buildSheetsData(wb) {
  const data = {};
  const problems = [];

  CATALOG_TILES.forEach(tile => {
    ['mhi', 'gal'].forEach(brand => {
      const cfg = tile[brand];
      if (!cfg) return;
      if (!wb.SheetNames.includes(cfg.sheet)) {
        problems.push(tile.label + ' / ' + brand.toUpperCase() + ' (вкладку "' + cfg.sheet + '" не знайдено у файлі)');
        return;
      }
      const sheet = wb.Sheets[cfg.sheet];
      let rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (cfg.splitMarker) rows = sliceBySplitMarker(rows, cfg.splitMarker, cfg.splitSide);
      const result = parseSheet(rows, cfg.highlight);
      if (result.items.length > 0) {
        if (cfg.baseAdjustPct) {
          const factor = 1 - cfg.baseAdjustPct / 100;
          result.items.forEach(it => { it.price = it.price * factor; });
        }
        data[cfg.key] = result.items;
      } else {
        problems.push(tile.label + ' / ' + brand.toUpperCase() + (result.error ? ' (' + result.error + ')' : ''));
      }
    });
  });

  return { data, problems };
}

/* ---------- Кеш прайсу (локально на пристрої) ---------- */
function loadProcessedCache() {
  try {
    const raw = localStorage.getItem('sunice_price_cache');
    if (!raw) return false;
    const cached = JSON.parse(raw);
    if (!cached || !cached.data) return false;
    sheetsData = cached.data;
    priceVersion = cached.version || null;
    setCatalogStatus('Востаннє оновлено: ' + new Date(cached.savedAt).toLocaleString('uk-UA') + (priceVersion ? ' · версія ' + priceVersion : ''));
    return true;
  } catch (e) {
    return false;
  }
}
function persistProcessedCache(version) {
  try {
    localStorage.setItem('sunice_price_cache', JSON.stringify({ data: sheetsData, version, savedAt: Date.now() }));
  } catch (e) {}
}

async function checkPriceVersion() {
  try {
    const { data, error } = await sb.from('price_meta').select('version, updated_at').eq('id', 1).single();
    if (error || !data) return null;
    return data;
  } catch (e) {
    return null;
  }
}

async function downloadAndParsePrice() {
  const res = await fetch(PRICE_FILE_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
  const { data, problems } = buildSheetsData(wb);
  sheetsData = data;
  const errBlock = document.getElementById('error-block');
  errBlock.innerHTML = problems.length
    ? '<div class="warn">Не вдалося розпізнати: ' + escapeHtml(problems.join(', ')) + '</div>'
    : '';
}

function setCatalogStatus(text) {
  const row = document.getElementById('status-row');
  const el = document.getElementById('status-text');
  if (!text) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  el.textContent = text;
}

async function initCatalog() {
  document.getElementById('refresh-icon').style.display = 'flex';
  const hadCache = loadProcessedCache();
  if (hadCache) {
    renderCatalogView();
    return;
  }
  setCatalogStatus('Завантаження прайсу...');
  renderCatalogView();
  try {
    const meta = await checkPriceVersion();
    await downloadAndParsePrice();
    priceVersion = meta ? meta.version : 1;
    persistProcessedCache(priceVersion);
    setCatalogStatus('Завантажено: ' + new Date().toLocaleString('uk-UA') + (meta ? ' · версія ' + priceVersion : ''));
  } catch (e) {
    setCatalogStatus('Немає підключення до інтернету. Прайс ще не завантажено.');
  }
  renderCatalogView();
}

async function handleRefreshClick() {
  setCatalogStatus('Перевірка оновлень...');
  const meta = await checkPriceVersion();
  if (!meta) {
    setCatalogStatus('Не вдалося перевірити оновлення. Перевірте інтернет-з’єднання.');
    return;
  }
  if (priceVersion !== null && meta.version === priceVersion) {
    setCatalogStatus('Прайс актуальний (версія ' + meta.version + ')');
    return;
  }
  setCatalogStatus('Завантаження нового прайсу...');
  try {
    await downloadAndParsePrice();
    priceVersion = meta.version;
    persistProcessedCache(priceVersion);
    setCatalogStatus('Оновлено: ' + new Date().toLocaleString('uk-UA') + ' · версія ' + priceVersion);
    renderCatalogView();
  } catch (e) {
    setCatalogStatus('Немає підключення. Відображається остання завантажена версія прайсу.');
  }
}

/* ---------- Відображення каталогу ---------- */
function tileHasAnyData(tile) {
  return (tile.mhi && sheetsData[tile.mhi.key]) || (tile.gal && sheetsData[tile.gal.key]);
}
function tileActiveCfg(tile) {
  return tile[activeBrand] || tile.mhi || tile.gal || null;
}

function renderCatalogView() {
  const backBtn = document.getElementById('back-btn');
  const title = document.getElementById('title');
  const searchBlock = document.getElementById('search-block');

  if (activeTile === null) {
    backBtn.style.display = 'none';
    title.textContent = 'Каталог';
    searchBlock.style.display = 'none';
    renderCatalogMenu();
  } else {
    backBtn.style.display = 'flex';
    const tile = CATALOG_TILES.find(t => t.id === activeTile);
    title.textContent = tile ? tile.label : activeTile;
    searchBlock.style.display = 'block';
    document.getElementById('search').value = '';
    document.getElementById('sort').value = 'none';
    renderCatalogList();
  }
}

function renderCatalogMenu() {
  const main = document.getElementById('main');
  const hasData = Object.keys(sheetsData).length > 0;
  if (!hasData) {
    main.innerHTML = '<div class="empty">Прайс ще не завантажено.</div>';
    return;
  }
  const tiles = CATALOG_TILES.map(tile => {
    const initials = tile.label.slice(0, 2).toUpperCase();
    const filled = tileHasAnyData(tile);
    if (!filled) {
      return `
        <div class="menu-tile menu-tile-empty">
          <div class="menu-tile-row">
            <div class="menu-tile-icon">${escapeHtml(initials)}</div>
            <div class="menu-tile-soon">Скоро</div>
          </div>
          <div class="menu-tile-title">${escapeHtml(tile.label)}</div>
        </div>`;
    }
    return `
      <div class="menu-tile" data-tile="${escapeHtml(tile.id)}">
        <div class="menu-tile-row">
          <div class="menu-tile-icon">${escapeHtml(initials)}</div>
        </div>
        <div class="menu-tile-title">${escapeHtml(tile.label)}</div>
      </div>`;
  }).join('');
  main.innerHTML = '<div class="menu-grid">' + tiles + '</div>';
  main.querySelectorAll('.menu-tile[data-tile]').forEach(el => {
    el.addEventListener('click', () => {
      const tileId = el.getAttribute('data-tile');
      history.pushState({ tab: 'catalog', tile: tileId }, '', '#' + encodeURIComponent(tileId));

function renderCatalogList() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const sort = document.getElementById('sort').value;
  const main = document.getElementById('main');

  const tile = CATALOG_TILES.find(t => t.id === activeTile);
  if (!tile) { main.innerHTML = '<div class="empty">Нічого не знайдено</div>'; return; }

  const hasBoth = !!(tile.mhi && tile.gal);
  const cfg = tileActiveCfg(tile);
  const toggleHtml = hasBoth ? `
    <div class="brand-toggle">
      <button type="button" class="brand-toggle-btn ${activeBrand === 'mhi' ? 'active' : ''}" data-brand="mhi">MHI</button>
      <button type="button" class="brand-toggle-btn ${activeBrand === 'gal' ? 'active' : ''}" data-brand="gal">GAL</button>
    </div>` : '';

  const allItems = cfg ? (sheetsData[cfg.key] || []) : [];

  if (!cfg || allItems.length === 0) {
    main.innerHTML = toggleHtml + '<div class="empty">Прайс для цього розділу ще не завантажено.</div>';
    attachBrandToggleHandlers(main);
    return;
  }

  let filtered = allItems.filter(it => !search || it.model.toLowerCase().includes(search));

  if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
  else if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
  else if (sort === 'name-asc') filtered.sort((a, b) => a.model.localeCompare(b.model, 'uk'));

  const countHtml = '<div class="count">Знайдено: ' + filtered.length + '</div>';
  const showSegments = sort === 'none';
  let lastKey = null;

  const rowsHtml = filtered.map(it => {
    let header = '';
    if (showSegments && it.groupKey && it.groupKey !== lastKey) {
      lastKey = it.groupKey;
      header = `<div class="segment-header" style="${it.color ? 'border-color:' + it.color : ''}">${escapeHtml(it.groupKey)}</div>`;
    } else if (showSegments && !it.groupKey) {
      lastKey = null;
    }
    const priceStr = Math.round(it.price).toLocaleString('uk-UA') + (it.currency ? ' ' + it.currency : '');
    return header + `
      <div class="row" style="${it.color ? 'background:' + it.color + ';border-color:transparent;' : ''}">
        <div class="row-click-zone" data-model="${escapeHtml(it.model)}" aria-label="Пошук в Google"></div>
        <div class="row-info">
          <p class="row-name">${escapeHtml(it.model)}</p>
          <div class="calc-panel" data-price="${it.price}">
            <span>${priceStr} −</span>
            <input type="number" class="calc-input" min="0" max="99" placeholder="0" inputmode="numeric">
            <span>% =</span>
            <span class="calc-result">${priceStr}</span>
          </div>
        </div>
        <div class="row-right">
          <div class="row-price">${priceStr}</div>
          <button class="calc-toggle" type="button" aria-label="Розрахувати знижку">%</button>
        </div>
      </div>
    `;
  }).join('');

  main.innerHTML = toggleHtml + countHtml + (filtered.length ? rowsHtml : '<div class="empty">Нічого не знайдено</div>');
  attachBrandToggleHandlers(main);
}

function attachBrandToggleHandlers(main) {

/* Дозволені формати зображень для акцій: за MIME-типом і, про всяк випадок, за розширенням
   (деякі Android-пікери не завжди коректно проставляють file.type). */
const PROMO_IMAGE_MIME_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
const PROMO_IMAGE_EXTENSIONS = ['png', 'jpg', 'jpeg', 'webp', 'gif'];

function isAllowedPromoImage(file) {
  if (file.type && PROMO_IMAGE_MIME_TYPES.includes(file.type)) return true;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  return PROMO_IMAGE_EXTENSIONS.includes(ext);
}

function guessImageContentType(file) {
  if (file.type && PROMO_IMAGE_MIME_TYPES.includes(file.type)) return file.type;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
  if (ext === 'webp') return 'image/webp';
  if (ext === 'gif') return 'image/gif';
  return 'image/png';
}

async function uploadPromoFile(file) {
  if (!isAllowedPromoImage(file)) {
    throw new Error('Непідтримуваний формат файлу. Дозволені: PNG, JPG, WEBP, GIF.');
  }
  const contentType = guessImageContentType(file);
  const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const { error: uploadError } = await sb.storage.from('promo-pdfs').upload(fileName, file, {
    contentType,
    upsert: false
  });
  if (uploadError) throw uploadError;
  const { data: publicUrlData } = sb.storage.from('promo-pdfs').getPublicUrl(fileName);
  return publicUrlData ? publicUrlData.publicUrl : null;
}

async function handlePromoUpload() {
  const titleInput = document.getElementById('promo-title-input');
  const imageInput = document.getElementById('promo-image-input');
  const statusEl = document.getElementById('promo-upload-status');
  const title = (titleInput.value || '').trim();
  const imageFile = imageInput.files && imageInput.files[0];

  if (!title) { statusEl.textContent = 'Введіть назву акції.'; return; }
  if (!imageFile) { statusEl.textContent = 'Виберіть зображення акції.'; return; }

  statusEl.textContent = 'Завантаження...';
  const btn = document.getElementById('promo-upload-btn');
  btn.disabled = true;

  try {
    const imageUrl = await uploadPromoFile(imageFile);

    const { data: maxRow } = await sb.from('promotions').select('sort_order').order('sort_order', { ascending: false }).limit(1).single();
    const nextSort = maxRow && typeof maxRow.sort_order === 'number' ? maxRow.sort_order + 1 : 1;

    const row = { title, is_active: true, sort_order: nextSort };
    if (imageUrl) row.image_url = imageUrl;

    const { error: insertError } = await sb.from('promotions').insert(row);
    if (insertError) throw insertError;

    statusEl.textContent = 'Готово! Акцію додано.';
    renderPromotionsTab();
  } catch (e) {
    statusEl.textContent = 'Помилка: ' + (e.message || 'не вдалося завантажити.');
    btn.disabled = false;
  }
}

/* ---------- Видалення акції (тільки super_admin) ---------- */
function extractPromoStoragePath(url) {
  if (!url) return null;
  const marker = '/storage/v1/object/public/promo-pdfs/';
  const idx = url.indexOf(marker);
  if (idx === -1) return null;
  try { return decodeURIComponent(url.slice(idx + marker.length)); } catch (e) { return url.slice(idx + marker.length); }
}

async function handleDeletePromo(id, imageUrl, pdfUrl) {
  if (!confirm('Видалити цю акцію назавжди? Цю дію не можна скасувати.')) return;
  try {
    const paths = [imageUrl, pdfUrl].map(extractPromoStoragePath).filter(Boolean);
    if (paths.length) {
      /* Не критично, якщо видалення файлу зі сховища не вдасться — головне прибрати запис з БД */
      await sb.storage.from('promo-pdfs').remove(paths).catch(function () {});
    }
    const { error } = await sb.from('promotions').delete().eq('id', id);
    if (error) throw error;
    renderPromotionsTab();
  } catch (e) {
    alert('Не вдалося видалити акцію: ' + (e.message || 'невідома помилка.'));
  }
}

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = fullPhoneFromLocalInput('reg-phone');
  const password = document.getElementById('reg-password').value;
  const regionSelect = document.getElementById('reg-region');
  const regionId = regionSelect.value;
  const errEl = document.getElementById('reg-error');
  errEl.innerHTML = '';

  if (!name || normalizePhoneDigits(phone).length <= 2 || !password || !regionId) {
    errEl.innerHTML = '<div class="error">Заповніть усі поля.</div>';
    return;
  }
  if (password.length < 6) {
    errEl.innerHTML = '<div class="error">Пароль має містити щонайменше 6 символів.</div>';
    return;
  }
  if (normalizePhoneDigits(phone).length < 11) {
    errEl.innerHTML = '<div class="error">Перевірте номер телефону.</div>';
    return;
  }

  const btn = document.getElementById('reg-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Реєстрація...';

  const { data: signUpData, error: signUpError } = await sb.auth.signUp({
    email: phoneToEmail(phone),
    password: password
  });

  if (signUpError) {
    const already = signUpError.message && /registered|exists/i.test(signUpError.message);
    errEl.innerHTML = '<div class="error">' + (already ? 'Цей номер телефону вже зареєстровано. Спробуйте увійти.' : 'Не вдалося зареєструватися. Спробуйте ще раз.') + '</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  const userId = signUpData && signUpData.user ? signUpData.user.id : null;
  if (!userId) {
    errEl.innerHTML = '<div class="error">Реєстрацію не завершено. Спробуйте увійти або зверніться до адміністратора.</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  const { error: profileError } = await sb.from('profiles').upsert({
    id: userId,
    full_name: name,
    phone: phone,
    region_id: parseInt(regionId, 10),
    status: 'pending',
    price_type: 'regular',
    role: 'user'
  }, { onConflict: 'id' });

  if (profileError) {
    errEl.innerHTML = '<div class="error">Акаунт створено, але не вдалося зберегти дані профілю. Зверніться до адміністратора.</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  renderCabinetTab();
}

/* ---- Push-сповіщення (для адміністраторів) ---- */
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const out = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
  return out;
}

async function getPushSubscriptionState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return { supported: false, enabled: false };
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return { supported: true, enabled: !!sub };
  } catch (e) {
    return { supported: true, enabled: false };
  }
}

async function enablePushNotifications(userId) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Цей браузер не підтримує push-сповіщення.');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('Дозвіл на сповіщення не надано. Увімкнути його можна в налаштуваннях браузера/застосунку.');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({
      user_id: userId,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' });
    if (error) { alert('Не вдалося зберегти підписку на сповіщення.'); return; }
    renderCabinetTab();
  } catch (e) {
    alert('Не вдалося увімкнути сповіщення на цьому пристрої.');
  }
}

}

/* ---- Адмін-панель (regional_admin / super_admin) ---- */
let adminUsersCache = [];

async function renderAdminPanel(profile) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Завантаження...</div>';

  const regions = await getRegions();
  const regionName = id => { const r = regions.find(x => x.id === id); return r ? r.name : ''; };

  const { data: users, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) {
    main.innerHTML = '<div class="empty">Не вдалося завантажити користувачів.</div><button class="logout-btn" id="cab-logout-btn">Вийти</button>';
    document.getElementById('cab-logout-btn').addEventListener('click', handleLogout);
    return;
  }

  adminUsersCache = users || [];
  const isSuper = profile.role === 'super_admin';

  function userCardHtml(u, isPending) {
    const badgeClass = 'badge-' + u.status;
    const canDelete = u.id !== profile.id && (isSuper || (profile.role === 'regional_admin' && u.role !== 'super_admin'));
    const deleteBtn = canDelete ? `<button type="button" class="reject" data-action="delete" data-id="${u.id}">Видалити</button>` : '';
    let actions;
    if (isPending) {
      actions = `
        <div class="user-card-actions">
          <button type="button" class="approve" data-action="approve" data-id="${u.id}">Підтвердити</button>
          <button type="button" class="reject" data-action="reject" data-id="${u.id}">Відхилити</button>
          ${deleteBtn}
        </div>`;
    } else {
      const blockLabel = u.status === 'blocked' ? 'Розблокувати' : 'Заблокувати';
      const blockAction = u.status === 'blocked' ? 'unblock' : 'block';
      actions = `
        <div class="user-card-row">
          <select data-action="price_type" data-id="${u.id}">
            <option value="regular" ${u.price_type === 'regular' ? 'selected' : ''}>Стандартна ціна</option>
            <option value="client" ${u.price_type === 'client' ? 'selected' : ''}>Клієнтська ціна</option>
            <option value="vip" ${u.price_type === 'vip' ? 'selected' : ''}>VIP ціна</option>
          </select>
          ${isSuper ? `<select data-action="role" data-id="${u.id}">
            <option value="user" ${u.role === 'user' ? 'selected' : ''}>Користувач</option>
            <option value="regional_admin" ${u.role === 'regional_admin' ? 'selected' : ''}>Регіон. адмін</option>
            <option value="super_admin" ${u.role === 'super_admin' ? 'selected' : ''}>Супер-адмін</option>
          </select>` : ''}
        </div>
        <div class="user-card-actions">
          <button type="button" data-action="${blockAction}" data-id="${u.id}">${blockLabel}</button>
          ${deleteBtn}
        </div>`;
    }
    return `
      <div class="user-card">
        <div class="user-card-top">
          <div>
            <p class="user-card-name">${escapeHtml(u.full_name || '(без імені)')}</p>
            <p class="user-card-sub">${escapeHtml(u.phone || '')} · ${escapeHtml(regionName(u.region_id))}${!isPending ? ' · ' + escapeHtml(roleLabel(u.role)) : ''}</p>
          </div>
          <span class="badge ${badgeClass}">${escapeHtml(statusLabel(u.status))}</span>
        </div>
        ${actions}
      </div>`;
  }

  const pending = adminUsersCache.filter(u => u.status === 'pending');
  const others = adminUsersCache.filter(u => u.status !== 'pending');
  const pushState = await getPushSubscriptionState();

  let html = '';
  if (pushState.supported) {
    html += pushState.enabled
      ? '<div class="push-status">🔔 Сповіщення на цьому пристрої увімкнено</div>'
      : '<button type="button" class="link-btn push-enable-btn" id="enable-push-btn">🔔 Увімкнути сповіщення на цьому пристрої</button>';
  }
  html += `<div class="admin-section-title">Заявки на розгляді (${pending.length})</div>`;
  html += pending.length ? pending.map(u => userCardHtml(u, true)).join('') : '<div class="empty" style="padding:16px;">Нових заявок немає</div>';
  html += `<div class="admin-section-title">Користувачі (${others.length})</div>`;
  html += '<div class="admin-search"><input type="text" id="admin-search" placeholder="Пошук за іменем або телефоном"></div>';
  html += '<div id="admin-users-list">' + (others.length ? others.map(u => userCardHtml(u, false)).join('') : '<div class="empty" style="padding:16px;">Користувачів немає</div>') + '</div>';
  html += '<button class="logout-btn" id="cab-logout-btn">Вийти</button>';

  main.innerHTML = html;
  clearNotificationsAndBadge();

  document.getElementById('cab-logout-btn').addEventListener('click', handleLogout);
  document.getElementById('admin-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = others.filter(u => !q || (u.full_name || '').toLowerCase().includes(q) || (u.phone || '').toLowerCase().includes(q));
    document.getElementById('admin-users-list').innerHTML = filtered.length
      ? filtered.map(u => userCardHtml(u, false)).join('')
      : '<div class="empty" style="padding:16px;">Нічого не знайдено</div>';
  });
  const enablePushBtn = document.getElementById('enable-push-btn');
  if (enablePushBtn) enablePushBtn.addEventListener('click', () => enablePushNotifications(profile.id));
}

async function handleAdminAction(action, id, value) {
  if (action === 'delete') {
    if (!confirm('Видалити цього користувача назавжди? Він зможе зареєструватися заново з тим самим номером. Цю дію не можна скасувати.')) return;
    const { data, error } = await sb.functions.invoke('admin-delete-user', { body: { user_id: id } });
    if (error || (data && data.error)) {
      const detail = (data && data.error) || (error && error.message) || 'невідома помилка';
      alert('Не вдалося видалити користувача: ' + detail);
      return;
    }
    renderCabinetTab();
    return;
  }

  let update = null;
  if (action === 'approve') update = { status: 'approved' };
  else if (action === 'reject') update = { status: 'rejected' };
  else if (action === 'block') update = { status: 'blocked' };
  else if (action === 'unblock') update = { status: 'approved' };
  else if (action === 'price_type') update = { price_type: value };
  else if (action === 'role') update = { role: value };
  else return;

  const { error } = await sb.from('profiles').update(update).eq('id', id);
  if (error) {
    alert('Не вдалося зберегти зміни. Спробуйте ще раз.');
    return;
  }
  renderCabinetTab();
}

function switchTab(tab, pushHistory) {
  currentTab = tab;
  activeTile = null;
  infoSection = null;
  infoBrand = null;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
  });
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('search-block').style.display = 'none';
  document.getElementById('refresh-icon').style.display = tab === 'catalog' ? 'flex' : 'none';
  document.getElementById('shortcut-icon').style.display = tab === 'cabinet' ? 'flex' : 'none';
  document.getElementById('status-row').style.display = 'none';
  document.getElementById('error-block').innerHTML = '';
  if (pushHistory) {
    history.pushState({ tab: tab }, '', '#' + tab);
  }
}

function renderCurrentTab() {
  if (currentTab === 'catalog') {
    if (!catalogInitDone) { catalogInitDone = true; initCatalog(); }
    else renderCatalogView();
  } else if (currentTab === 'promotions') renderPromotionsTab();
  else if (currentTab === 'cabinet') renderCabinetTab();
  else if (currentTab === 'contacts') renderContactsTab();
  else if (currentTab === 'info') renderInfoTab();
}

document.querySelectorAll('.nav-btn').forEach(btn => {

    switchTab(tab, true);
    renderCurrentTab();
  });
});

   викликаний вручну (корисно, якщо автоматичний банер з якоїсь причини не показався). */
async function triggerAddToHomeScreen() {
  if (isStandalone) {
    alert('Застосунок уже встановлено на цьому пристрої.');
    return;
  }
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('shortcut-icon').style.opacity = '0.5';
    return;
  }
  if (isIOS) {
    alert('Щоб встановити застосунок на iPhone/iPad: натисніть кнопку «Поділитися» ⬆ внизу екрана Safari → «На екран Домой».');
    return;
  }
  alert('Браузер поки не пропонує швидке встановлення (можливо, застосунок вже додавався раніше, або сторінку щойно відкрито). Спробуйте: меню браузера (⋮) → «Додати на головний екран» / «Встановити застосунок».');
}

    '<p class="install-gate-desc">Готово! Застосунок встановлено. Закрийте цю вкладку браузера і відкрийте Sun-ice з ярлика на головному екрані.</p>'
  );
}

function renderInstallGateManualFallback() {
  setInstallGateSheet(
    installGateHeaderHtml() +
    '<p class="install-gate-desc">Браузер поки не готовий запропонувати швидке встановлення. Відкрийте меню браузера (⋮) і оберіть «Додати на головний екран» / «Встановити застосунок».</p>' +
    '<button type="button" class="install-gate-later-btn" id="install-gate-later-btn">Не зараз</button>'
  );
  document.getElementById('install-gate-later-btn').addEventListener('click', renderInstallGateConfirmSkip);
}

function renderInstallGateIOS() {
  setInstallGateSheet(
    installGateHeaderHtml() +
    '<p class="install-gate-desc">Щоб встановити застосунок на iPhone/iPad: натисніть кнопку «Поділитися» ⬆ внизу екрана Safari, потім оберіть «На екран Домой».</p>' +
    '<button type="button" class="install-gate-later-btn" id="install-gate-later-btn">Не зараз</button>'
  );
  document.getElementById('install-gate-later-btn').addEventListener('click', renderInstallGateConfirmSkip);
}

function renderInstallGateInApp(name) {
  setInstallGateSheet(
    installGateHeaderHtml() +
    '<p class="install-gate-desc">Це посилання відкрито у вбудованому браузері ' + escapeHtml(name) + ' — з нього застосунок не встановлюється. Натисніть «⋮» (або «...») у верхньому куті екрана і оберіть «Відкрити в браузері» (Chrome/Safari), а вже там встановіть застосунок.</p>' +
    '<button type="button" class="install-gate-later-btn" id="install-gate-later-btn">Не зараз</button>'
  );
  document.getElementById('install-gate-later-btn').addEventListener('click', renderInstallGateConfirmSkip);
}

function renderInstallGateMain() {
  const inApp = detectInAppBrowserName();
  if (inApp) { renderInstallGateInApp(inApp); return; }
  if (isIOS) { renderInstallGateIOS(); return; }

  setInstallGateSheet(
    installGateHeaderHtml() +
    '<p class="install-gate-desc">Встановіть застосунок на головний екран телефону — швидкий запуск без браузера та push-сповіщення про нові акції і статус заявки.</p>' +
    '<button type="button" class="install-gate-install-btn" id="install-gate-install-btn">Встановити</button>' +
    '<button type="button" class="install-gate-later-btn" id="install-gate-later-btn">Не зараз</button>'
  );
  document.getElementById('install-gate-install-btn').addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if (choice && choice.outcome === 'accepted') renderInstallGateInstalled();
    } else {
      renderInstallGateManualFallback();
    }
  });
  document.getElementById('install-gate-later-btn').addEventListener('click', renderInstallGateConfirmSkip);
}

function showInstallGate() {
  if (isStandalone) return;
  if (localStorage.getItem(INSTALL_GATE_SKIP_KEY) === '1') return;
  renderInstallGateMain();
  document.getElementById('install-gate').classList.add('show');
}

window.addEventListener('appinstalled', () => {
  if (document.getElementById('install-gate').classList.contains('show')) {
    renderInstallGateInstalled();
  }
});

/* ---------- Перегляд зображення на весь екран: наближення/віддалення, панорамування ---------- */
(function () {
  const overlay = document.getElementById('img-lightbox-overlay');
  const stage = document.getElementById('img-lightbox-stage');
  const imgEl = document.getElementById('img-lightbox-img');
  const zoomInBtn = document.getElementById('img-lightbox-zoomin');
  const zoomOutBtn = document.getElementById('img-lightbox-zoomout');
  const resetBtn = document.getElementById('img-lightbox-reset');
  const closeBtn = document.getElementById('img-lightbox-close');

  const MIN_SCALE = 1;
  const MAX_SCALE = 6;
  let scale = 1, tx = 0, ty = 0;
  const pointers = new Map();
  let pinchStartDist = null;
  let dragStart = null;
  let lastTapTime = 0;

  function applyTransform() {
    imgEl.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
  }

  function clampScale(s) { return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s)); }

  function resetView() { scale = 1; tx = 0; ty = 0; applyTransform(); }

  window.openImageLightbox = function (url) {
    if (!url) return;
    imgEl.src = url;
    resetView();
    overlay.classList.add('active');
  };

  function closeLightbox() {
    overlay.classList.remove('active');
    imgEl.src = '';
    pointers.clear();
    pinchStartDist = null;
    dragStart = null;
  }

  closeBtn.addEventListener('click', closeLightbox);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay || e.target === stage) closeLightbox();
  });
  zoomInBtn.addEventListener('click', function () { scale = clampScale(scale + 0.5); applyTransform(); });
  zoomOutBtn.addEventListener('click', function () { scale = clampScale(scale - 0.5); applyTransform(); });
  resetBtn.addEventListener('click', resetView);

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  imgEl.addEventListener('pointerdown', function (e) {
    imgEl.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragStart = { x: e.clientX - tx, y: e.clientY - ty };
    } else if (pointers.size === 2) {
      dragStart = null;
      const pts = Array.from(pointers.values());
      pinchStartDist = dist(pts[0], pts[1]);
    }
  });

  imgEl.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      const d = dist(pts[0], pts[1]);
      const m = mid(pts[0], pts[1]);
      if (pinchStartDist) {
        const newScale = clampScale(scale * (d / pinchStartDist));
        tx = m.x - (m.x - tx) * (newScale / scale);
        ty = m.y - (m.y - ty) * (newScale / scale);
        scale = newScale;
        applyTransform();
      }
      pinchStartDist = d;
    } else if (dragStart && pointers.size === 1 && scale > MIN_SCALE) {
      tx = e.clientX - dragStart.x;
      ty = e.clientY - dragStart.y;
      applyTransform();
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStartDist = null;
    if (pointers.size === 0) {
      dragStart = null;
      const now = Date.now();
      if (now - lastTapTime < 300) {
        if (scale > MIN_SCALE) resetView();
        else { scale = 2.5; applyTransform(); }
      }
      lastTapTime = now;
    }
  }
  imgEl.addEventListener('pointerup', endPointer);
  imgEl.addEventListener('pointercancel', endPointer);
  imgEl.addEventListener('pointerleave', endPointer);

  imgEl.addEventListener('wheel', function (e) {
    e.preventDefault();
    const newScale = clampScale(scale + (e.deltaY < 0 ? 0.3 : -0.3));
    tx = e.clientX - (e.clientX - tx) * (newScale / scale);
    ty = e.clientY - (e.clientY - ty) * (newScale / scale);
    scale = newScale;
    applyTransform();
  }, { passive: false });
})();
