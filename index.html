<style>
  :root {
    --bg: #F8FAFC;
    --card: #ffffff;
    --border: #E2E8F0;
    --text: #0F172A;
    --text-secondary: #64748B;
    --accent: #E60012;
    --accent-bg: #FEE2E2;
    --danger: #a32d2d;
    --navy: #0F172A;
    --navy-2: #1E293B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #fff; }

  /* Install banner */
  .install-banner {
    display: none;
    background: linear-gradient(to right, #111827, var(--navy-2), var(--navy));
    color: #fff;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    font-size: 13px;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #1e293b;
  }
  .install-banner.show { display: flex; }
  .install-banner-text { flex: 1; line-height: 1.4; display: flex; align-items: center; gap: 8px; }
  .install-banner-text::before {
    content: '';
    width: 5px; height: 22px;
    background: var(--accent);
    border-radius: 3px;
    flex-shrink: 0;
  }
  .install-banner button {
    background: #fff;
    color: var(--navy);
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .install-banner .close-x {
    background: transparent;
    color: #94a3b8;
    font-size: 16px;
    padding: 4px 6px;
    font-weight: 400;
  }

  /* Header */
  header {
    padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .install-banner.show ~ .app header { padding-top: 16px; }
  .header-top { display: flex; align-items: center; gap: 10px; }
  .back-btn {
    display: none;
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--text);
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin: 0; flex: 1; display: flex; align-items: center; gap: 9px; }
  h1::before {
    content: '';
    width: 9px; height: 9px;
    background: var(--accent);
    border-radius: 2px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .status-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .status-text { font-size: 12px; color: var(--text-secondary); flex: 1; }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  input[type=file] { display: none; }

  .search-row { margin-top: 10px; display: flex; gap: 8px; }
  input[type=text] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  select {
    padding: 10px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }

  main { flex: 1; padding: 8px 12px 90px; background: var(--bg); }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.6;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px -1px rgba(15,23,42,0.06);
    display: flex;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  .nav-btn {
    position: relative;
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 2px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn .nav-icon { font-size: 19px; line-height: 1; }
  .nav-btn.active { color: var(--accent); font-weight: 700; }
  .nav-btn.active::before {
    content: '';
    position: absolute;
    top: 0;
    width: 30px;
    height: 3px;
    border-radius: 0 0 4px 4px;
    background: var(--accent);
  }

  /* Home menu (catalog categories) */
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-top: 8px;
  }
  .menu-tile {
    background: var(--card);
    border: 1px solid #CBD5E1;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 92px;
    justify-content: space-between;
    box-shadow: 0 2px 8px -2px rgba(15,23,42,0.05), 0 1px 4px -1px rgba(15,23,42,0.03);
    transition: box-shadow .15s, transform .1s, border-color .15s;
  }
  .menu-tile:active { transform: scale(0.985); border-color: #CBD5E1; box-shadow: none; }
  .menu-tile-row { display: flex; align-items: center; justify-content: space-between; }
  .menu-tile-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; color: var(--text); }
  .menu-tile-empty { cursor: default; border-color: rgba(203,213,225,0.7); }
  .menu-tile-empty:active { transform: none; }
  .menu-tile-empty .menu-tile-title { color: var(--text-secondary); font-weight: 600; }

];

/* ЖАРТ-НАПИСИ (тимчасово) — щоб прибрати жарти, просто постав false */
const JOKE_MODE = true;

/* Push-сповіщення адміністраторам про нову заявку + лічильник на іконці застосунку.
   Публічний VAPID-ключ — безпечно тримати в клієнтському коді (це не секрет). */
const VAPID_PUBLIC_KEY = 'BIoU6N899jbSOeI02wfVBgX5M4VUq6oM-Vz_TeDiUYxIdjgbW9w2Jeza2ao54kirnajo6eSDzo6QA_-wnmBYKiM';
/* ======================================================= */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTab = 'catalog';
let sheetsData = {};
let activeTile = null; // null = меню категорій каталогу
let activeBrand = 'mhi'; // 'mhi' | 'gal' — активний бренд у плитці з перемикачем
let priceVersion = null;
let catalogInitDone = false;

/* ---------- Допоміжні функції парсингу прайсу ---------- */
const priceKeywordGroups = [
  ['ціна дилер', 'цена дилер', 'dealer price'],
  ['роздрібна ціна', 'розничная цена', 'retail price'],
  ['ціна', 'цена', 'price', 'стоимость']
];
const modelKeywords = ['модель', 'маркировка', 'маркування', 'артикул', 'sku', 'model', 'найменування', 'наименование'];
const internalKeywords = ['внутрішній', 'внутренний', 'indoor'];
const externalKeywords = ['зовнішній', 'наружный', 'outdoor'];
const totalSubKeywords = ['комплект', 'всього', 'разом', 'итого', 'total'];
const categoryStems = ['настінн', 'стельов', 'касетн', 'канальн', 'колонн', 'підлогов', 'підвісн', 'шафов'];
const PALETTE = ['#dbeafe', '#dcfce7', '#fef9c3', '#fce7f3', '#ede9fe', '#ffedd5', '#ccfbf1', '#fee2e2'];

function norm(v) { return String(v == null ? '' : v).toLowerCase().trim(); }
function cellContainsAny(v, keywords) {
  const s = norm(v);
  if (!s) return false;
  return keywords.some(k => s.includes(k));
}
function parseNumber(val) {
  if (typeof val === 'number') return isFinite(val) ? val : null;
  if (!val) return null;
  const s = String(val).trim();
  if (!s) return null;
  const cleaned = s.replace(/\s/g, '').replace(/[^\d.,-]/g, '').replace(',', '.');
  const num = parseFloat(cleaned);
  return isNaN(num) ? null : num;
}
function detectCurrency(headerText) {
  const s = norm(headerText);
  if (s.includes('грн')) return 'грн';
  if (s.includes('у.е') || s.includes('$')) return '$';
  if (s.includes('₴')) return '₴';
  return '';
}
function findPriceHeader(rows) {
  for (const group of priceKeywordGroups) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r] || [];
      for (let c = 0; c < row.length; c++) {
        if (cellContainsAny(row[c], group)) return { row: r, col: c, text: row[c] };
      }
    }
  }
  return null;
}
function findColumnInRow(row, keywords) {
  if (!row) return -1;
  for (let c = 0; c < row.length; c++) {
    if (cellContainsAny(row[c], keywords)) return c;
  }
  return -1;
}
function extractSeries(model) {
  if (!model) return null;
  const first = model.split(/[\s+]/)[0];
  const m = first.match(/^[A-ZА-ЯІЇЄ]+-?(\d+)([A-ZА-ЯІЇЄ]+)/i);
  return m ? m[2].toUpperCase() : null;
}
function isCategoryLabel(text) {
  const s = norm(text);
  if (!s) return false;
  return categoryStems.some(stem => s.includes(stem));
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function parseSheet(rows, highlightMode) {
  const priceHeader = findPriceHeader(rows);
  if (!priceHeader) return { items: [], error: 'Не знайдено колонку з ціною' };

  let priceCol = priceHeader.col;
  let dataStart = priceHeader.row + 1;
  const nextRow = rows[priceHeader.row + 1];
  if (nextRow) {
    for (let c = priceCol; c < nextRow.length; c++) {
      if (cellContainsAny(nextRow[c], totalSubKeywords)) {
        priceCol = c;
        dataStart = priceHeader.row + 2;
        break;
      }
    }
  }

  const headerRow = rows[priceHeader.row] || [];
  const headerRowAbove = rows[priceHeader.row - 1] || [];
  let modelCol = findColumnInRow(headerRow, modelKeywords);
  if (modelCol === -1) modelCol = findColumnInRow(headerRowAbove, modelKeywords);

  const internalCol = findColumnInRow(headerRow, internalKeywords);
  const externalCol = findColumnInRow(headerRow, externalKeywords);
  const currency = detectCurrency(priceHeader.text);
  const items = [];
  let currentCategory = null;

  for (let r = dataStart; r < rows.length; r++) {
    const row = rows[r] || [];
    const price = parseNumber(row[priceCol]);

    if (price === null && highlightMode === 'category' && modelCol !== -1) {
      const labelText = String(row[modelCol] || '').trim();
      const hasInternal = internalCol !== -1 && row[internalCol];
      const hasExternal = externalCol !== -1 && row[externalCol];
      if (labelText && !hasInternal && !hasExternal && isCategoryLabel(labelText)) {
        currentCategory = labelText;
      }
    }

    if (price === null) continue;

    let model = modelCol !== -1 ? String(row[modelCol] || '').trim() : '';
    if (!model && internalCol !== -1) {
      const parts = [row[internalCol], row[externalCol]].filter(v => v && String(v).trim());
      model = parts.map(v => String(v).trim()).join(' + ');
    }
    if (!model) continue;

    const item = { model, price, currency };
    if (highlightMode === 'series') item.groupKey = extractSeries(model);
    else if (highlightMode === 'category') item.groupKey = currentCategory;
    items.push(item);
  }

  if (highlightMode) {
    const colorMap = new Map();
    items.forEach(it => {
      if (!it.groupKey) return;
      if (!colorMap.has(it.groupKey)) colorMap.set(it.groupKey, PALETTE[colorMap.size % PALETTE.length]);
      it.color = colorMap.get(it.groupKey);
    });
  }

  return { items, error: items.length === 0 ? 'Не знайдено рядків з маркуванням і ціною' : null };
}

function sliceBySplitMarker(rows, marker, side) {
  const idx = rows.findIndex(row => (row || []).some(cell => norm(cell).includes(marker)));
  if (idx === -1) return rows; // маркер не знайдено — повертаємо все як є
  return side === 'after' ? rows.slice(idx) : rows.slice(0, idx);
}

function buildSheetsData(wb) {
  const data = {};
  const problems = [];

  CATALOG_TILES.forEach(tile => {
    ['mhi', 'gal'].forEach(brand => {
      const cfg = tile[brand];
      if (!cfg) return;
      if (!wb.SheetNames.includes(cfg.sheet)) {
        problems.push(tile.label + ' / ' + brand.toUpperCase() + ' (вкладку "' + cfg.sheet + '" не знайдено у файлі)');
        return;
      }
      const sheet = wb.Sheets[cfg.sheet];
      let rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (cfg.splitMarker) rows = sliceBySplitMarker(rows, cfg.splitMarker, cfg.splitSide);
      const result = parseSheet(rows, cfg.highlight);
      if (result.items.length > 0) {
        if (cfg.baseAdjustPct) {
          const factor = 1 - cfg.baseAdjustPct / 100;
          result.items.forEach(it => { it.price = it.price * factor; });
        }
        data[cfg.key] = result.items;
      } else {
        problems.push(tile.label + ' / ' + brand.toUpperCase() + (result.error ? ' (' + result.error + ')' : ''));
      }
    });
  });

  return { data, problems };
}

/* ---------- Кеш прайсу (локально на пристрої) ---------- */
function loadProcessedCache() {
  try {
    const raw = localStorage.getItem('sunice_price_cache');
    if (!raw) return false;
    const cached = JSON.parse(raw);
    if (!cached || !cached.data) return false;
    sheetsData = cached.data;
    priceVersion = cached.version || null;
    setCatalogStatus('Востаннє оновлено: ' + new Date(cached.savedAt).toLocaleString('uk-UA') + (priceVersion ? ' · версія ' + priceVersion : ''));
    return true;
  } catch (e) {
    return false;
  }
}
function persistProcessedCache(version) {
  try {
    localStorage.setItem('sunice_price_cache', JSON.stringify({ data: sheetsData, version, savedAt: Date.now() }));
  } catch (e) {}
}

async function checkPriceVersion() {
  try {
    const { data, error } = await sb.from('price_meta').select('version, updated_at').eq('id', 1).single();
    if (error || !data) return null;
    return data;
  } catch (e) {
    return null;
  }
}

async function downloadAndParsePrice() {
  const res = await fetch(PRICE_FILE_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
  const { data, problems } = buildSheetsData(wb);
  sheetsData = data;
  const errBlock = document.getElementById('error-block');
  errBlock.innerHTML = problems.length
    ? '<div class="warn">Не вдалося розпізнати: ' + escapeHtml(problems.join(', ')) + '</div>'
    : '';
}

function setCatalogStatus(text) {
  const row = document.getElementById('status-row');
  const el = document.getElementById('status-text');
  if (!text) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  el.textContent = text;
}

async function initCatalog() {
  document.getElementById('refresh-icon').style.display = 'flex';
  const hadCache = loadProcessedCache();
  if (hadCache) {
    renderCatalogView();
    return;
  }
  setCatalogStatus('Завантаження прайсу...');
  renderCatalogView();
  try {
    const meta = await checkPriceVersion();
    await downloadAndParsePrice();
    priceVersion = meta ? meta.version : 1;
    persistProcessedCache(priceVersion);
    setCatalogStatus('Завантажено: ' + new Date().toLocaleString('uk-UA') + (meta ? ' · версія ' + priceVersion : ''));
  } catch (e) {
    setCatalogStatus('Немає підключення до інтернету. Прайс ще не завантажено.');
  }
  renderCatalogView();
}

async function handleRefreshClick() {
  setCatalogStatus('Перевірка оновлень...');
  const meta = await checkPriceVersion();
  if (!meta) {
    setCatalogStatus('Не вдалося перевірити оновлення. Перевірте інтернет-з’єднання.');
    return;
  }
  if (priceVersion !== null && meta.version === priceVersion) {
    setCatalogStatus('Прайс актуальний (версія ' + meta.version + ')');
    return;
  }
  setCatalogStatus('Завантаження нового прайсу...');
  try {
    await downloadAndParsePrice();
    priceVersion = meta.version;
    persistProcessedCache(priceVersion);
    setCatalogStatus('Оновлено: ' + new Date().toLocaleString('uk-UA') + ' · версія ' + priceVersion);
    renderCatalogView();
  } catch (e) {
    setCatalogStatus('Немає підключення. Відображається остання завантажена версія прайсу.');
  }
}

function tileHasAnyData(tile) {
  return (tile.mhi && sheetsData[tile.mhi.key]) || (tile.gal && sheetsData[tile.gal.key]);
}
function tileActiveCfg(tile) {
  return tile[activeBrand] || tile.mhi || tile.gal || null;
}

function renderCatalogView() {
  const backBtn = document.getElementById('back-btn');

    renderCatalogMenu();
  } else {
    backBtn.style.display = 'flex';

    title.textContent = tile ? tile.label : activeTile;
    searchBlock.style.display = 'block';

function renderCatalogMenu() {
  const main = document.getElementById('main');

    main.innerHTML = '<div class="empty">Прайс ще не завантажено.</div>';
    return;
  }
  const tiles = CATALOG_TILES.map(tile => {
    const initials = tile.label.slice(0, 2).toUpperCase();
    const filled = tileHasAnyData(tile);
    if (!filled) {
      return `
        <div class="menu-tile menu-tile-empty">
          <div class="menu-tile-row">

            <div class="menu-tile-soon">Скоро</div>

      <div class="menu-tile" data-tile="${escapeHtml(tile.id)}">

          <div class="menu-tile-icon">${escapeHtml(initials)}</div>
        </div>

      </div>`;

function renderCatalogList() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const sort = document.getElementById('sort').value;
  const main = document.getElementById('main');

  const tile = CATALOG_TILES.find(t => t.id === activeTile);
  if (!tile) { main.innerHTML = '<div class="empty">Нічого не знайдено</div>'; return; }

  const hasBoth = !!(tile.mhi && tile.gal);
  const cfg = tileActiveCfg(tile);
  const toggleHtml = hasBoth ? `
    <div class="brand-toggle">
      <button type="button" class="brand-toggle-btn ${activeBrand === 'mhi' ? 'active' : ''}" data-brand="mhi">MHI</button>
      <button type="button" class="brand-toggle-btn ${activeBrand === 'gal' ? 'active' : ''}" data-brand="gal">GAL</button>
    </div>` : '';

  const allItems = cfg ? (sheetsData[cfg.key] || []) : [];

  if (!cfg || allItems.length === 0) {
    main.innerHTML = toggleHtml + '<div class="empty">Прайс для цього розділу ще не завантажено.</div>';
    attachBrandToggleHandlers(main);
    return;
  }

  let filtered = allItems.filter(it => !search || it.model.toLowerCase().includes(search));

  if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
  else if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
  else if (sort === 'name-asc') filtered.sort((a, b) => a.model.localeCompare(b.model, 'uk'));

  const countHtml = '<div class="count">Знайдено: ' + filtered.length + '</div>';
  const showSegments = sort === 'none';
  let lastKey = null;

  const rowsHtml = filtered.map(it => {
    let header = '';
    if (showSegments && it.groupKey && it.groupKey !== lastKey) {
      lastKey = it.groupKey;
      header = `<div class="segment-header" style="${it.color ? 'border-color:' + it.color : ''}">${escapeHtml(it.groupKey)}</div>`;
    } else if (showSegments && !it.groupKey) {
      lastKey = null;
    }
    const priceStr = Math.round(it.price).toLocaleString('uk-UA') + (it.currency ? ' ' + it.currency : '');
    return header + `
      <div class="row" style="${it.color ? 'background:' + it.color + ';border-color:transparent;' : ''}">
        <div class="row-click-zone" data-model="${escapeHtml(it.model)}" aria-label="Пошук в Google"></div>
        <div class="row-info">
          <p class="row-name">${escapeHtml(it.model)}</p>
          <div class="calc-panel" data-price="${it.price}">
            <span>${priceStr} −</span>
            <input type="number" class="calc-input" min="0" max="99" placeholder="0" inputmode="numeric">
            <span>% =</span>
            <span class="calc-result">${priceStr}</span>
          </div>
        </div>
        <div class="row-right">
          <div class="row-price">${priceStr}</div>
          <button class="calc-toggle" type="button" aria-label="Розрахувати знижку">%</button>
        </div>
      </div>
    `;
  }).join('');

  main.innerHTML = toggleHtml + countHtml + (filtered.length ? rowsHtml : '<div class="empty">Нічого не знайдено</div>');
  attachBrandToggleHandlers(main);
}

function attachBrandToggleHandlers(main) {
  main.querySelectorAll('.brand-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const brand = btn.getAttribute('data-brand');
      if (brand === activeBrand) return;
      activeBrand = brand;
      renderCatalogList();
    });
  });
}

document.getElementById('main').addEventListener('click', function(e) {
  if (currentTab !== 'catalog') return;
  const zoneEl = e.target.closest('.row-click-zone');
  if (zoneEl) {
    const model = zoneEl.getAttribute('data-model');
    if (model) window.open('https://www.google.com/search?q=' + encodeURIComponent(model), '_blank');
    return;
  }
  const toggleBtn = e.target.closest('.calc-toggle');
  if (toggleBtn) {
    const rowEl = toggleBtn.closest('.row');
    const panel = rowEl.querySelector('.calc-panel');
    if (panel) {
      const showing = panel.classList.toggle('open');
      if (showing) {
        const input = panel.querySelector('.calc-input');
        if (input) input.focus();
      }
    }
    return;
  }
});
document.getElementById('main').addEventListener('input', function(e) {
  if (!e.target.classList.contains('calc-input')) return;
  const panel = e.target.closest('.calc-panel');
  const price = parseFloat(panel.getAttribute('data-price'));
  let pct = parseFloat(e.target.value);
  if (isNaN(pct) || pct < 0) pct = 0;
  if (pct > 99) pct = 99;
  const result = Math.round(price * (1 - pct / 100));
  const resultEl = panel.querySelector('.calc-result');
  if (resultEl) resultEl.textContent = result.toLocaleString('uk-UA');
});
document.getElementById('search').addEventListener('input', renderCatalogList);
document.getElementById('sort').addEventListener('change', renderCatalogList);
document.getElementById('refresh-icon').addEventListener('click', handleRefreshClick);
document.getElementById('back-btn').addEventListener('click', function() { history.back(); });

async function uploadPromoFile(file, expectedType, label) {
  if (file.type !== expectedType) throw new Error(label + ': непідтримуваний формат файлу.');
  const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const { error: uploadError } = await sb.storage.from('promo-pdfs').upload(fileName, file, {
    contentType: expectedType,
    upsert: false
  });
  if (uploadError) throw uploadError;
  const { data: publicUrlData } = sb.storage.from('promo-pdfs').getPublicUrl(fileName);
  return publicUrlData ? publicUrlData.publicUrl : null;
}

async function handlePromoUpload() {
  const titleInput = document.getElementById('promo-title-input');
  const pdfInput = document.getElementById('promo-pdf-input');
  const imageInput = document.getElementById('promo-image-input');
  const statusEl = document.getElementById('promo-upload-status');
  const title = (titleInput.value || '').trim();
  const pdfFile = pdfInput.files && pdfInput.files[0];
  const imageFile = imageInput.files && imageInput.files[0];

  if (!title) { statusEl.textContent = 'Введіть назву акції.'; return; }
  if (!pdfFile && !imageFile) { statusEl.textContent = 'Виберіть PDF-файл і/або PNG-зображення.'; return; }

  statusEl.textContent = 'Завантаження...';
  const btn = document.getElementById('promo-upload-btn');
  btn.disabled = true;

  try {
    const [pdfUrl, imageUrl] = await Promise.all([
      pdfFile ? uploadPromoFile(pdfFile, 'application/pdf', 'PDF') : Promise.resolve(null),
      imageFile ? uploadPromoFile(imageFile, 'image/png', 'PNG') : Promise.resolve(null)
    ]);

    const { data: maxRow } = await sb.from('promotions').select('sort_order').order('sort_order', { ascending: false }).limit(1).single();
    const nextSort = maxRow && typeof maxRow.sort_order === 'number' ? maxRow.sort_order + 1 : 1;

    const row = { title, is_active: true, sort_order: nextSort };
    if (pdfUrl) row.pdf_url = pdfUrl;
    if (imageUrl) row.image_url = imageUrl;

    const { error: insertError } = await sb.from('promotions').insert(row);
    if (insertError) throw insertError;

    statusEl.textContent = 'Готово! Акцію додано.';
    renderPromotionsTab();
  } catch (e) {
    statusEl.textContent = 'Помилка: ' + (e.message || 'не вдалося завантажити.');
    btn.disabled = false;
  }
}

    return;
  }

  if (profile.role === 'regional_admin' || profile.role === 'super_admin') {
    renderAdminPanel(profile);
  } else {
    renderUserStatus(profile);
  }
}

/* ---- Неавторизований стан: вхід / реєстрація ---- */
function renderAuthForms() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="auth-toggle">
      <button type="button" id="auth-tab-login" class="${cabinetMode === 'login' ? 'active' : ''}">Вхід</button>
      <button type="button" id="auth-tab-register" class="${cabinetMode === 'register' ? 'active' : ''}">Реєстрація</button>
    </div>
    <div id="auth-form-holder"></div>
  `;
  document.getElementById('auth-tab-login').addEventListener('click', () => { cabinetMode = 'login'; renderAuthForms(); });
  document.getElementById('auth-tab-register').addEventListener('click', () => { cabinetMode = 'register'; renderAuthForms(); });
  if (cabinetMode === 'login') renderLoginForm(); else renderRegisterForm();
}

/* Прибирає з поля все, крім цифр, під час вводу (щоб залишався тільки номер після +38) */
function attachDigitsOnlyFilter(input) {
  input.addEventListener('input', () => {
    const cleaned = input.value.replace(/\D/g, '');
    if (cleaned !== input.value) input.value = cleaned;
  });
}
/* Складає повний номер у форматі +38XXXXXXXXXX з локальної частини, введеної користувачем */
function fullPhoneFromLocalInput(inputId) {
  const local = document.getElementById(inputId).value.trim();
  return '+38' + local;
}

function renderLoginForm() {
  const holder = document.getElementById('auth-form-holder');
  holder.innerHTML = `
    <div class="field">
      <label>Номер телефону</label>
      <div class="phone-input-row">
        <span class="phone-prefix">+38</span>
        <input type="tel" id="login-phone" placeholder="0501234567" maxlength="10" inputmode="numeric">
      </div>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="login-password" placeholder="Ваш пароль">
    </div>
    <button class="primary-btn" id="login-submit-btn">Увійти</button>
    <div id="login-error"></div>
  `;
  attachDigitsOnlyFilter(document.getElementById('login-phone'));
  document.getElementById('login-submit-btn').addEventListener('click', handleLogin);
  holder.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  });
}

async function handleLogin() {
  const phone = fullPhoneFromLocalInput('login-phone');
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.innerHTML = '';
  if (normalizePhoneDigits(phone).length <= 2 || !password) {
    errEl.innerHTML = '<div class="error">Введіть телефон і пароль.</div>';
    return;
  }
  const btn = document.getElementById('login-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Вхід...';
  const { error } = await sb.auth.signInWithPassword({ email: phoneToEmail(phone), password: password });
  if (error) {
    errEl.innerHTML = '<div class="error">Невірний телефон або пароль.</div>';
    btn.disabled = false;
    btn.textContent = 'Увійти';
    return;
  }
  renderCabinetTab();
}

async function renderRegisterForm() {
  const holder = document.getElementById('auth-form-holder');
  holder.innerHTML = '<div class="empty">Завантаження...</div>';
  const regions = await getRegions();
  const options = regions.map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
  holder.innerHTML = `
    ${JOKE_MODE ? '<div class="joke-banner">Зареєструйся і отримаєш винагороду 🎁</div>' : ''}
    <div class="field">
      <label>Ім’я та прізвище</label>
      <input type="text" id="reg-name" placeholder="Введіть ім’я">
    </div>
    <div class="field">
      <label>Номер телефону</label>
      <div class="phone-input-row">
        <span class="phone-prefix">+38</span>
        <input type="tel" id="reg-phone" placeholder="0501234567" maxlength="10" inputmode="numeric">
      </div>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="reg-password" placeholder="Не менше 6 символів">
    </div>
    <div class="field">
      <label>Регіон</label>
      <select id="reg-region">${options}</select>
    </div>
    <button class="primary-btn" id="reg-submit-btn">Зареєструватися</button>
    <div id="reg-error"></div>
  `;
  attachDigitsOnlyFilter(document.getElementById('reg-phone'));
  document.getElementById('reg-submit-btn').addEventListener('click', handleRegister);

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = fullPhoneFromLocalInput('reg-phone');
  const password = document.getElementById('reg-password').value;
  const regionSelect = document.getElementById('reg-region');
  const regionId = regionSelect.value;
  const errEl = document.getElementById('reg-error');
  errEl.innerHTML = '';

  if (!name || normalizePhoneDigits(phone).length <= 2 || !password || !regionId) {
    errEl.innerHTML = '<div class="error">Заповніть усі поля.</div>';
    return;
  }
  if (password.length < 6) {
    errEl.innerHTML = '<div class="error">Пароль має містити щонайменше 6 символів.</div>';
    return;
  }
  if (normalizePhoneDigits(phone).length < 11) {
    errEl.innerHTML = '<div class="error">Перевірте номер телефону.</div>';
    return;
  }

  const btn = document.getElementById('reg-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Реєстрація...';

  const { data: signUpData, error: signUpError } = await sb.auth.signUp({
    email: phoneToEmail(phone),
    password: password
  });

  if (signUpError) {
    const already = signUpError.message && /registered|exists/i.test(signUpError.message);
    errEl.innerHTML = '<div class="error">' + (already ? 'Цей номер телефону вже зареєстровано. Спробуйте увійти.' : 'Не вдалося зареєструватися. Спробуйте ще раз.') + '</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  const userId = signUpData && signUpData.user ? signUpData.user.id : null;
  if (!userId) {
    errEl.innerHTML = '<div class="error">Реєстрацію не завершено. Спробуйте увійти або зверніться до адміністратора.</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  const { error: profileError } = await sb.from('profiles').upsert({
    id: userId,
    full_name: name,
    phone: phone,
    region_id: parseInt(regionId, 10),
    status: 'pending',
    price_type: 'regular',
    role: 'user'
  }, { onConflict: 'id' });

  if (profileError) {
    errEl.innerHTML = '<div class="error">Акаунт створено, але не вдалося зберегти дані профілю. Зверніться до адміністратора.</div>';
    btn.disabled = false;
    btn.textContent = 'Зареєструватися';
    return;
  }

  renderCabinetTab();
}

/* ---- Push-сповіщення (для адміністраторів) ---- */
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const out = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
  return out;
}

async function getPushSubscriptionState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return { supported: false, enabled: false };
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return { supported: true, enabled: !!sub };
  } catch (e) {
    return { supported: true, enabled: false };
  }
}

async function enablePushNotifications(userId) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Цей браузер не підтримує push-сповіщення.');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('Дозвіл на сповіщення не надано. Увімкнути його можна в налаштуваннях браузера/застосунку.');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({
      user_id: userId,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' });
    if (error) { alert('Не вдалося зберегти підписку на сповіщення.'); return; }
    renderCabinetTab();
  } catch (e) {
    alert('Не вдалося увімкнути сповіщення на цьому пристрої.');
  }
}

/* Коли адмін відкрив Кабінет — вважаємо, що заявки переглянуті: гасимо бейдж і закриваємо сповіщення */
function clearNotificationsAndBadge() {
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage('clear-notifications');
  }
  if ('clearAppBadge' in navigator) {
    try { navigator.clearAppBadge(); } catch (e) {}
  }
}

/* ---- Авторизований звичайний користувач ---- */
function renderUserStatus(profile) {
  const main = document.getElementById('main');
  const priceLine = profile.status === 'approved' ? '<br>Тип цін: ' + escapeHtml(priceTypeLabel(profile.price_type)) : '';
  main.innerHTML = `
    <div class="status-card">
      <div class="status-card-title">${escapeHtml(statusLabel(profile.status))}</div>
      <div class="status-card-sub">${escapeHtml(profile.full_name || '')}<br>${escapeHtml(profile.phone || '')}${priceLine}</div>
    </div>
    ${JOKE_MODE && profile.status === 'pending' ? '<div class="joke-note">Зареєструвались, не перенавантажились!? Винагорода? Дякуємо, що не насварили :-)</div>' : ''}
    <button class="logout-btn" id="cab-logout-btn">Вийти</button>
  `;
  document.getElementById('cab-logout-btn').addEventListener('click', handleLogout);
}

async function handleLogout() {
  await sb.auth.signOut();
  cabinetMode = 'login';
  renderCabinetTab();
}

/* ---- Адмін-панель (regional_admin / super_admin) ---- */
let adminUsersCache = [];

async function renderAdminPanel(profile) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Завантаження...</div>';

  const regions = await getRegions();
  const regionName = id => { const r = regions.find(x => x.id === id); return r ? r.name : ''; };

  const { data: users, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) {
    main.innerHTML = '<div class="empty">Не вдалося завантажити користувачів.</div><button class="logout-btn" id="cab-logout-btn">Вийти</button>';
    document.getElementById('cab-logout-btn').addEventListener('click', handleLogout);
    return;
  }

  adminUsersCache = users || [];
  const isSuper = profile.role === 'super_admin';

  function userCardHtml(u, isPending) {
    const badgeClass = 'badge-' + u.status;
    const canDelete = u.id !== profile.id && (isSuper || (profile.role === 'regional_admin' && u.role !== 'super_admin'));
    const deleteBtn = canDelete ? `<button type="button" class="reject" data-action="delete" data-id="${u.id}">Видалити</button>` : '';
    let actions;
    if (isPending) {
      actions = `
        <div class="user-card-actions">
          <button type="button" class="approve" data-action="approve" data-id="${u.id}">Підтвердити</button>
          <button type="button" class="reject" data-action="reject" data-id="${u.id}">Відхилити</button>
          ${deleteBtn}
        </div>`;
    } else {
      const blockLabel = u.status === 'blocked' ? 'Розблокувати' : 'Заблокувати';
      const blockAction = u.status === 'blocked' ? 'unblock' : 'block';
      actions = `
        <div class="user-card-row">
          <select data-action="price_type" data-id="${u.id}">
            <option value="regular" ${u.price_type === 'regular' ? 'selected' : ''}>Стандартна ціна</option>
            <option value="client" ${u.price_type === 'client' ? 'selected' : ''}>Клієнтська ціна</option>
            <option value="vip" ${u.price_type === 'vip' ? 'selected' : ''}>VIP ціна</option>
          </select>
          ${isSuper ? `<select data-action="role" data-id="${u.id}">
            <option value="user" ${u.role === 'user' ? 'selected' : ''}>Користувач</option>
            <option value="regional_admin" ${u.role === 'regional_admin' ? 'selected' : ''}>Регіон. адмін</option>
            <option value="super_admin" ${u.role === 'super_admin' ? 'selected' : ''}>Супер-адмін</option>
          </select>` : ''}
        </div>
        <div class="user-card-actions">
          <button type="button" data-action="${blockAction}" data-id="${u.id}">${blockLabel}</button>
          ${deleteBtn}
        </div>`;
    }
    return `
      <div class="user-card">
        <div class="user-card-top">
          <div>
            <p class="user-card-name">${escapeHtml(u.full_name || '(без імені)')}</p>
            <p class="user-card-sub">${escapeHtml(u.phone || '')} · ${escapeHtml(regionName(u.region_id))}${!isPending ? ' · ' + escapeHtml(roleLabel(u.role)) : ''}</p>
          </div>
          <span class="badge ${badgeClass}">${escapeHtml(statusLabel(u.status))}</span>
        </div>
        ${actions}
      </div>`;
  }

  const pending = adminUsersCache.filter(u => u.status === 'pending');
  const others = adminUsersCache.filter(u => u.status !== 'pending');
  const pushState = await getPushSubscriptionState();

  let html = '';
  if (pushState.supported) {
    html += pushState.enabled
      ? '<div class="push-status">🔔 Сповіщення на цьому пристрої увімкнено</div>'
      : '<button type="button" class="link-btn push-enable-btn" id="enable-push-btn">🔔 Увімкнути сповіщення на цьому пристрої</button>';
  }
  html += `<div class="admin-section-title">Заявки на розгляді (${pending.length})</div>`;
  html += pending.length ? pending.map(u => userCardHtml(u, true)).join('') : '<div class="empty" style="padding:16px;">Нових заявок немає</div>';
  html += `<div class="admin-section-title">Користувачі (${others.length})</div>`;
  html += '<div class="admin-search"><input type="text" id="admin-search" placeholder="Пошук за іменем або телефоном"></div>';
  html += '<div id="admin-users-list">' + (others.length ? others.map(u => userCardHtml(u, false)).join('') : '<div class="empty" style="padding:16px;">Користувачів немає</div>') + '</div>';
  html += '<button class="logout-btn" id="cab-logout-btn">Вийти</button>';

  main.innerHTML = html;
  clearNotificationsAndBadge();

  document.getElementById('cab-logout-btn').addEventListener('click', handleLogout);
  document.getElementById('admin-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = others.filter(u => !q || (u.full_name || '').toLowerCase().includes(q) || (u.phone || '').toLowerCase().includes(q));
    document.getElementById('admin-users-list').innerHTML = filtered.length
      ? filtered.map(u => userCardHtml(u, false)).join('')
      : '<div class="empty" style="padding:16px;">Нічого не знайдено</div>';
  });
  const enablePushBtn = document.getElementById('enable-push-btn');
  if (enablePushBtn) enablePushBtn.addEventListener('click', () => enablePushNotifications(profile.id));
}

async function handleAdminAction(action, id, value) {
  if (action === 'delete') {
    if (!confirm('Видалити цього користувача назавжди? Він зможе зареєструватися заново з тим самим номером. Цю дію не можна скасувати.')) return;
    const { data, error } = await sb.functions.invoke('admin-delete-user', { body: { user_id: id } });
    if (error || (data && data.error)) {
      const detail = (data && data.error) || (error && error.message) || 'невідома помилка';
      alert('Не вдалося видалити користувача: ' + detail);
      return;
    }
    renderCabinetTab();
    return;
  }

  let update = null;
  if (action === 'approve') update = { status: 'approved' };
  else if (action === 'reject') update = { status: 'rejected' };
  else if (action === 'block') update = { status: 'blocked' };
  else if (action === 'unblock') update = { status: 'approved' };
  else if (action === 'price_type') update = { price_type: value };
  else if (action === 'role') update = { role: value };
  else return;

  const { error } = await sb.from('profiles').update(update).eq('id', id);
  if (error) {
    alert('Не вдалося зберегти зміни. Спробуйте ще раз.');
    return;
  }
  renderCabinetTab();
}

/* ---------- Перемикання вкладок нижнього меню ---------- */
function switchTab(tab, pushHistory) {
  currentTab = tab;
  activeTile = null;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
  });
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('search-block').style.display = 'none';
  document.getElementById('refresh-icon').style.display = tab === 'catalog' ? 'flex' : 'none';
  document.getElementById('status-row').style.display = 'none';
  document.getElementById('error-block').innerHTML = '';
  if (pushHistory) {
    history.pushState({ tab: tab }, '', '#' + tab);
  }
}

function renderCurrentTab() {
  if (currentTab === 'catalog') {
    if (!catalogInitDone) { catalogInitDone = true; initCatalog(); }
    else renderCatalogView();
  } else if (currentTab === 'promotions') renderPromotionsTab();
  else if (currentTab === 'cabinet') renderCabinetTab();
  else if (currentTab === 'contacts') renderContactsTab();
  else if (currentTab === 'info') renderInfoTab();
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.getAttribute('data-tab');
    if (tab === currentTab && activeTile === null) return;
    switchTab(tab, true);
    renderCurrentTab();
  });
});

/* ---------- Встановлення на головний екран ---------- */
let deferredInstallPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const bannerDismissed = localStorage.getItem('sunice_install_dismissed') === '1';

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandalone && !bannerDismissed) showInstallBanner('android');
});

if (isIOS && !isStandalone && !bannerDismissed) {
  showInstallBanner('ios');
}

function showInstallBanner(platform) {
  const banner = document.getElementById('install-banner');
  const textEl = document.getElementById('install-banner-text');
  const actionBtn = document.getElementById('install-action-btn');
  if (platform === 'android') {
    textEl.textContent = 'Встановіть застосунок Sun-ice на головний екран';
    actionBtn.style.display = 'inline-block';
    actionBtn.onclick = async () => {
      banner.classList.remove('show');
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      }
    };
  } else {
    textEl.textContent = 'Щоб встановити застосунок: натисніть «Поділитися» ⬆ внизу екрана → «На екран Домой»';
    actionBtn.style.display = 'none';
  }
  banner.classList.add('show');
}
document.getElementById('install-close-btn').addEventListener('click', () => {
  document.getElementById('install-banner').classList.remove('show');
  localStorage.setItem('sunice_install_dismissed', '1');
});

/* ---------- Service worker (push-сповіщення + бейдж на іконці) ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

/* ---------- Старт ---------- */
history.replaceState({ tab: 'catalog' }, '', '#catalog');
renderCurrentTab();
</script>
